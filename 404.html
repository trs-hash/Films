<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Тарас Максимʼяк</title>
<meta name="robots" content="noindex">
<script>
    // Посилання на день (/d/РРРР-ММ-ДД/), сторінки якого ще не згенерував архів, — відкриваємо цей день на стіні;
    // будь-яка інша неіснуюча адреса — головна.
    (function () {
        var m = location.pathname.match(/\/d\/(\d{4}-\d{2}-\d{2})\/?$/);
        location.replace('/' + (m ? '#d=' + m[1] : ''));
    })();
</script>
</head>
<body style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;margin:40px">
<p><a href="/">Тарас Максимʼяк · стіна днів</a></p>
</body>
</html>
