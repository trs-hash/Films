<script>
    // TODO: заміни на НОВИЙ ключ з окремого проєкту "taras-site" (крок 2 інструкції).
    // Старий ключ після заміни регенеруй у консолі — опублікована копія помре.
    const API_KEY = 'AIzaSyBk_r3wrlYczHybeZtnPBID4zK_yv_XuHw';
    const CHANNEL_URL = 'https://www.youtube.com/@Taras.maksymiak';

    // ── Головна — «стіна днів» (з 29.09.2026 календар знову головний) ───────────
    // Календар щоденних відео — перше, що бачить глядач. Налаштування в seasons.json → "calendar":
    // start (перший день), playlist (звідки брати відео; UU… — усі завантаження каналу),
    // exclude (плейлисти-винятки, напр. Shorts). Приватні/заплановані відео не показуємо.
    // Теми — хештеги з назви й опису відео (#подорожі): з них сам збирається каталог тем;
    // "topics" дає темам назви, описи й синоніми, "ignore_tags" — хештеги, які не є темами.
    // Сезони ("seasons": weekly — картки серій, daily — окрема стіна днів) — необовʼязкові, під календарем.
    // Режими (state.json): youtube — жива стрічка з API; doomsday — локальний archive.json (розкладка за датами).
    // Самоперевірка після правок: taras.kyiv.ua/?check — що сайт зрозумів і що виправити.
    let MODE = 'youtube';
    let BASE = '';               // префікс локальних відео (Фаза 5); '' → грає YouTube-плеєр за id
    let CAL = null;              // календар головної: {k:'cal', id:'cal', format:'daily', start, end:'', playlist, exclude:[]}
    let TOPICS = { cfg: {}, alias: {}, ignore: new Set() };   // теми з seasons.json: назви/описи, синоніми, ігноровані хештеги
    let TOPIC = '';              // вибрана тема з адреси (#t=подорожі)
    let CAL_NOTE = '';           // чому календар порожній (для ?check)
    let SEASONS = [];            // нормалізовані сезони: {k,id,n,format,title,about,start,end,schedule,playlist,episodes,support}
    let EPS = {};                // {k: [rec]} відео календаря (k='cal') і сезонів, rec = {key,title,thumb,srcset,imp,tags,y,v,date,ts}
    let metaById = {};           // {key: {title,time,body,important}}
    let HIDDEN = {};             // {playlist: скільки приватних / запланованих / видалених відео пропущено}
    let ISSUES = [];             // знайдені ручні помилки — у консоль і на ?check
    let SRC = { seasons: '', eps: '' };   // звідки взялися дані — для ?check
    let LOADING = true;          // серії ще в дорозі (перший візит) → скелет замість «0 серій»
    let LOAD_FAILED = false;     // серії не вдалось отримати ні з YouTube, ні з архіву
    let PLAY = [];               // реєстр програвання: PLAY[idx] = {key,y,v} (без крихких inline-id)
    let EAGER = 0;               // скільки перших мініатюр вантажити одразу (перший екран), решта — ліниво
    let FIRST_IMG = true;        // найперша мініатюра — з найвищим пріоритетом (це LCP сторінки)
    let SUPPORT = { enabled: false, membership: null, donate: null, funds: [] };   // seasons.json → support (типово все вимкнено)
    let FUNDS_LIVE = null;       // fundraisers.json: {updated, jars: {ID банки: {raised, goal}}} — суми з monobank (GitHub Action)
    const CHECK = /[?&]check\b/.test(location.search);
    const BOOT = window.BOOT || {};
    const pad2 = n => String(n).padStart(2, '0');

    // localStorage буває недоступний (приватний режим, заборона cookies) або зі сміттям — сторінка не має падати
    function lsGet(k) { try { return localStorage.getItem(k); } catch(e) { return null; } }
    function lsSet(k, v) { try { localStorage.setItem(k, v); } catch(e) {} }
    function lsJSON(k, def) { try { let v = JSON.parse(lsGet(k)); return v == null ? def : v; } catch(e) { return def; } }
    let watched = lsJSON('vw', []);
    if (!Array.isArray(watched)) watched = [];

    function issue(msg) { ISSUES.push(msg); console.warn('[сезони] ' + msg); }

    function esc(s) {
        return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }

    // Записка серії (Трек C): опис відео = щоденник. Штамп часу з Треку B — підпис у кінці.
    // Маркер важливого — символ № (Shift+3, укр. розкладка), який НЕ є нумерацією («№5»).
    const IMPORTANT_RE = /№(?!\d)/;                                 // важлива серія (самостійний №)
    const TS_RE = /🕒\s*(\d{2}:\d{2}\s+\d{2}\/\d{2}\/\d{4})/;        // штамп часу з опису (Трек B, у кінці)
    // Червона зірочка-асстериск «наче від руки» — три хвилясті штрихи через центр.
    const STAR_SVG = '<svg class="star" viewBox="0 0 40 40" aria-hidden="true">' +
        '<g stroke="#e62117" stroke-width="3.4" stroke-linecap="round" fill="none">' +
        '<path d="M20 5 Q18.6 20 20.2 35"/>' +
        '<path d="M7 12.5 Q20 20 33.4 26.5"/>' +
        '<path d="M33 12 Q19.6 21 7.2 27.2"/></g></svg>';

    function parseDesc(raw) {
        let desc = (raw || '').replace(/\r/g, '');
        let important = IMPORTANT_RE.test(desc);
        let clean = desc.replace(/№(?!\d)/g, '');                     // прибрати маркер важливого
        let time = '';
        let m = clean.match(TS_RE);
        if (m) { time = m[1]; clean = clean.replace(m[0], ''); }       // прибрати штамп із тексту щоденника
        let body = clean.replace(/[ \t]{2,}/g, ' ').replace(/\n{3,}/g, '\n\n').trim();
        return { important, time, body };
    }

    // Теми = хештеги з назви й опису (#подорожі). Не беремо числа (#1), якорі в посиланнях (…/#top)
    // і службові (#shorts); регістр не важливий. Синоніми зводимо до однієї теми через "topics".
    const TAG_RE = /(^|[^\p{L}\p{N}_&\/])#([\p{L}\p{N}_]{2,40})/gu;
    const IGNORE_TAGS = ['shorts', 'short', 'youtubeshorts', 'ytshorts', 'youtube'];
    function tagsOf(...texts) {
        let out = [];
        texts.forEach(t => { for (const m of String(t || '').matchAll(TAG_RE)) {
            let tag = m[2].toLowerCase();
            if (!/^\d+$/.test(tag) && !out.includes(tag)) out.push(tag);
        } });
        return out;
    }
    function canonTag(t) { t = String(t || '').replace(/^#/, '').trim().toLowerCase(); return TOPICS.alias[t] || t; }
    function recTopics(rec) {                          // теми відео з урахуванням синонімів і ігнору
        let out = [];
        (rec.tags || []).forEach(t => { let c = canonTag(t); if (!TOPICS.ignore.has(c) && !out.includes(c)) out.push(c); });
        return out;
    }
    // Назва на плитці — без хвоста з хештегів («Дорога до моря #подорожі» → «Дорога до моря»): теми й так видно
    function showTitle(t) { t = String(t || ''); return t.replace(/(\s+#[\p{L}\p{N}_]+)+\s*$/u, '').trim() || t; }
    function topicLabel(t) { return (TOPICS.cfg[t] && TOPICS.cfg[t].title) || '#' + t; }
    function dayFromHash() {
        let m = ''; try { m = decodeURIComponent(location.hash.slice(1)); } catch(e) {}
        let d = (m.match(/(?:^|&)d=(\d{4}-\d{2}-\d{2})(?:&|$)/) || [])[1] || '';
        return DATE_RE.test(d) ? d : '';
    }
    function topicFromHash() {
        let h = ''; try { h = decodeURIComponent(location.hash.slice(1)); } catch(e) {}
        return h.startsWith('t=') ? canonTag(h.slice(2)) : '';
    }

    // ── Дати (рядки YYYY-MM-DD; різницю днів рахуємо в UTC — без стрибків через літній час) ──
    const MONTHS = ['Січень', 'Лютий', 'Березень', 'Квітень', 'Травень', 'Червень', 'Липень', 'Серпень', 'Вересень', 'Жовтень', 'Листопад', 'Грудень'];
    const MONTHS_GEN = ['січня', 'лютого', 'березня', 'квітня', 'травня', 'червня', 'липня', 'серпня', 'вересня', 'жовтня', 'листопада', 'грудня'];
    const WDAYS = ['НД', 'ПН', 'ВТ', 'СР', 'ЧТ', 'ПТ', 'СБ'];
    const DAY_MS = 864e5;
    const DATE_RE = /^\d{4}-\d{2}-\d{2}$/;
    function ymd(t) { return t.getFullYear() + '-' + pad2(t.getMonth() + 1) + '-' + pad2(t.getDate()); }
    function todayStr() { return ymd(new Date()); }
    // Момент публікації → день за місцевим часом глядача (відео о 00:30 за Києвом — це вже новий день, а не вчорашній UTC)
    function localDay(iso) { let t = new Date(iso); return isNaN(t) ? String(iso).slice(0, 10) : ymd(t); }
    function dayNum(s) { let [y, m, d] = s.split('-').map(Number); return Date.UTC(y, m - 1, d) / DAY_MS; }
    function fromDayNum(n) { let t = new Date(n * DAY_MS); return t.getUTCFullYear() + '-' + pad2(t.getUTCMonth() + 1) + '-' + pad2(t.getUTCDate()); }
    function fmtDay(s, withYear) {
        let [y, m, d] = s.split('-').map(Number);
        return d + ' ' + MONTHS_GEN[m - 1] + (withYear ? ' ' + y : '');
    }
    function fmtRange(s) {
        if (!s.start) return s.end ? 'до ' + fmtDay(s.end, true) : '';
        if (!s.end) return 'з ' + fmtDay(s.start, true);
        if (s.start === s.end) return fmtDay(s.start, true);
        let sameYear = s.start.slice(0, 4) === s.end.slice(0, 4);
        return fmtDay(s.start, !sameYear) + ' — ' + fmtDay(s.end, true);
    }
    function plural(n, one, few, many) {
        let m10 = n % 10, m100 = n % 100;
        if (m10 === 1 && m100 !== 11) return one;
        if (m10 >= 2 && m10 <= 4 && (m100 < 10 || m100 >= 20)) return few;
        return many;
    }

    function seasonState(s, today) {
        if (s.start && today < s.start) return 'soon';
        if (s.end && today > s.end) return 'done';
        return 'live';
    }

    // ── seasons.json: терпимо до типових ручних помилок, але кожну називаємо (консоль і ?check) ──
    const SEASON_KEYS = ['n', 'format', 'title', 'about', 'start', 'end', 'schedule', 'playlist', 'episodes', 'support'];
    const FORMATS = { weekly: 'weekly', 'щотижня': 'weekly', 'щотижневий': 'weekly', daily: 'daily', 'щодня': 'daily', 'щоденний': 'daily' };
    const str = v => v == null ? '' : String(v).trim();

    function parseLoose(text) {
        try { return JSON.parse(text); }
        catch(e) {
            try {                                        // найчастіша помилка — кома після останнього елемента
                let d = JSON.parse(text.replace(/,(\s*[}\]])/g, '$1'));
                issue('seasons.json: зайва кома перед } або ] — сайт її пропустив, але прибери у файлі');
                return d;
            } catch(_) {}
            let m = String(e.message).match(/position (\d+)/);
            let where = m ? ` (рядок ${text.slice(0, +m[1]).split('\n').length})` : '';
            throw new Error('файл зіпсований, це не коректний JSON' + where + ': ' + e.message);
        }
    }

    function normDate(v, what) {
        let s = str(v), m, y, mo, d;
        if (!s) return '';
        if ((m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/))) [y, mo, d] = [+m[1], +m[2], +m[3]];
        else if ((m = s.match(/^(\d{1,2})[./](\d{1,2})[./](\d{4})$/))) [y, mo, d] = [+m[3], +m[2], +m[1]];
        else { issue(`${what}: не розумію дату «${s}» — пиши РРРР-ММ-ДД, напр. 2026-09-20`); return ''; }
        let t = new Date(Date.UTC(y, mo - 1, d));
        if (t.getUTCFullYear() !== y || t.getUTCMonth() !== mo - 1 || t.getUTCDate() !== d) {
            issue(`${what}: дати «${s}» не існує`); return '';
        }
        let out = y + '-' + pad2(mo) + '-' + pad2(d);
        if (out !== s) issue(`${what}: «${s}» прочитано як ${out} — краще писати саме так`);
        return out;
    }

    function normPlaylist(v, what) {
        let s = str(v), m = s.match(/[?&]list=([\w-]+)/);
        if (m) { issue(`${what}: у playlist вставлено посилання — беру з нього ID ${m[1]}`); return m[1]; }
        if (s && !/^[\w-]+$/.test(s)) { issue(`${what}: «${s}» не схоже на ID плейлиста`); return ''; }
        return s;
    }

    function normUrl(v, what, hidden = 'кнопку «Підтримати» сховано') {
        let s = str(v);
        if (!s) return '';
        if (!/^[a-z][\w+.-]*:/i.test(s)) s = 'https://' + s.replace(/^\/+/, '');   // «send.monobank.ua/jar/…» без https://
        if (!/^https?:\/\/\S+$/i.test(s)) { issue(`${what}: «${str(v)}» не схоже на веб-адресу — ${hidden}`); return ''; }
        return s;
    }

    function normSeasons(raw) {
        let list = Array.isArray(raw) ? raw : (raw && Array.isArray(raw.seasons) ? raw.seasons : null);
        if (!list) { issue('seasons.json: не знайшов список сезонів — очікую {"seasons": [ … ]}'); return []; }
        let out = [], ids = {}, today = todayStr();
        list.forEach((s, i) => {
            let what = `seasons.json, сезон №${i + 1} у списку`;
            if (!s || typeof s !== 'object' || Array.isArray(s)) { issue(`${what}: це не обʼєкт {…} — пропускаю`); return; }
            Object.keys(s).forEach(key => {
                if (!SEASON_KEYS.includes(key)) issue(`${what}: невідоме поле «${key}» — описка? Відомі: ${SEASON_KEYS.join(', ')}`);
            });
            let n = parseInt(s.n, 10);
            if (!Number.isFinite(n)) { n = i + 1; issue(`${what}: нема номера n — показую як «Сезон ${n}»`); }
            what = `seasons.json, сезон ${n}`;
            let format = FORMATS[str(s.format).toLowerCase()] || 'weekly';
            if (str(s.format) && !FORMATS[str(s.format).toLowerCase()]) issue(`${what}: format «${str(s.format)}» невідомий — показую як weekly (можна weekly або daily)`);
            let start = normDate(s.start, what + ', start'), end = normDate(s.end, what + ', end');
            if (!start) issue(`${what}: нема дати start — вважаю, що сезон уже йде`);
            if (start && end && end < start) { issue(`${what}: end (${end}) раніше за start (${start}) — end ігнорую`); end = ''; }
            let id = 's-' + n;
            if (ids[id]) { issue(`${what}: номер ${n} уже є в іншого сезону`); id += '-' + i; }
            ids[id] = true;
            let ep = parseInt(s.episodes, 10);
            let season = { k: 'k' + i, id, n, format, title: str(s.title), about: str(s.about), start, end, schedule: str(s.schedule),
                playlist: normPlaylist(s.playlist, what), episodes: ep > 0 ? ep : 0, support: normUrl(s.support, what) };
            if (!season.playlist && seasonState(season, today) !== 'soon') issue(`${what}: нема плейлиста — серії з YouTube не зʼявляться`);
            out.push(season);
        });
        return out;
    }

    // Увесь seasons.json: календар, теми, сезони. Старий формат (просто список сезонів) теж розуміємо.
    const TOP_KEYS = ['calendar', 'topics', 'ignore_tags', 'seasons', 'support'];
    const CAL_KEYS = ['start', 'playlist', 'exclude'];
    const TOPIC_KEYS = ['tag', 'title', 'about', 'aliases'];
    const bareTag = v => str(v).replace(/^#/, '').toLowerCase();
    // Найімовірніша ручна помилка в календарі — вставити канал замість плейлиста.
    // ID каналу (UC…) або посилання /channel/UC… → беремо всі завантаження (UU…); @назва каналу — пояснюємо, що треба.
    function calPlaylist(v) {
        let s = str(v), m = s.match(/(?:^|\/channel\/)(UC[\w-]{22})(?:[/?#]|$)/);
        if (m) {
            let uu = 'UU' + m[1].slice(2);
            issue(`seasons.json, calendar: «${s}» — це канал, а не плейлист; беру всі його завантаження: ${uu}`);
            return uu;
        }
        if (/^@|youtube\.com\/@/.test(s)) {
            issue(`seasons.json, calendar: «${s}» — це назва каналу; потрібен ID плейлиста (усі завантаження каналу — UU…, див. README)`);
            return '';
        }
        return normPlaylist(s, 'seasons.json, calendar');
    }
    function normConfig(raw) {
        CAL = null; TOPICS = { cfg: {}, alias: {}, ignore: new Set(IGNORE_TAGS) }; SUPPORT = normSupport(null);
        if (Array.isArray(raw)) { SEASONS = normSeasons(raw); return; }
        if (!raw || typeof raw !== 'object') { issue('seasons.json: очікую обʼєкт {…}'); SEASONS = []; return; }
        Object.keys(raw).forEach(k => { if (!TOP_KEYS.includes(k)) issue(`seasons.json: невідоме поле «${k}» — описка? Відомі: ${TOP_KEYS.join(', ')}`); });
        let c = raw.calendar;
        if (c != null && (typeof c !== 'object' || Array.isArray(c))) issue('seasons.json, calendar: очікую обʼєкт {"start": …, "playlist": …}');
        else if (c != null) {
            Object.keys(c).forEach(k => { if (!CAL_KEYS.includes(k)) issue(`seasons.json, calendar: невідоме поле «${k}» — відомі: ${CAL_KEYS.join(', ')}`); });
            let ex = Array.isArray(c.exclude) ? c.exclude : (c.exclude ? [c.exclude] : []);
            CAL = { k: 'cal', id: 'cal', format: 'daily', end: '', start: normDate(c.start, 'seasons.json, calendar.start'),
                playlist: calPlaylist(c.playlist),
                exclude: ex.map(pl => normPlaylist(pl, 'seasons.json, calendar.exclude')).filter(Boolean) };
            if (!CAL.playlist) issue('seasons.json, calendar: нема playlist — календар не знає, звідки брати відео (усі завантаження каналу — ID на UU…)');
        }
        let tl = raw.topics == null ? [] : raw.topics;
        if (!Array.isArray(tl)) { issue('seasons.json, topics: очікую список [ … ]'); tl = []; }
        tl.forEach((t, i) => {
            let what = `seasons.json, topics №${i + 1}`;
            if (!t || typeof t !== 'object' || Array.isArray(t)) { issue(`${what}: це не обʼєкт {…}`); return; }
            Object.keys(t).forEach(k => { if (!TOPIC_KEYS.includes(k)) issue(`${what}: невідоме поле «${k}» — відомі: ${TOPIC_KEYS.join(', ')}`); });
            let tag = bareTag(t.tag);
            if (!tag) { issue(`${what}: нема tag (хештег теми без #)`); return; }
            TOPICS.cfg[tag] = { title: str(t.title), about: str(t.about) };
            (Array.isArray(t.aliases) ? t.aliases : []).forEach(a => { a = bareTag(a); if (a && a !== tag) TOPICS.alias[a] = tag; });
        });
        (Array.isArray(raw.ignore_tags) ? raw.ignore_tags : []).forEach(a => { a = bareTag(a); if (a) TOPICS.ignore.add(a); });
        SEASONS = raw.seasons == null ? [] : normSeasons(Array.isArray(raw.seasons) ? raw.seasons : raw);
        if (!CAL && raw.seasons == null) issue('seasons.json: нема ні calendar, ні seasons — сторінці нічого показувати');
        SUPPORT = normSupport(raw.support);
    }

    // ── Підтримка: seasons.json → "support" ─────────────────────────────────────
    // membership — платна підписка (типово YouTube «Стати спонсором», …/join; можна й Mono Base чи Patreon);
    // donate — разова підтримка (Mono Base, банка); fundraisers — актуальні збори з прогресом.
    // Глядач бачить пункт, лише коли увімкнено І весь блок (support.enabled), І сам пункт (enabled).
    // ?check показує все одразу на своїх місцях — з пунктирною рамкою й позначкою «вимкнено».
    const SUP_KEYS = ['enabled', 'membership', 'donate', 'fundraisers'];
    const LINK_KEYS = ['enabled', 'url', 'label', 'about'];
    const FUND_KEYS = ['enabled', 'id', 'title', 'about', 'url', 'goal', 'raised', 'until', 'kind'];
    const FUND_KINDS = { charity: 'charity', 'благодійний': 'charity', 'благодійність': 'charity', channel: 'channel', 'канал': 'channel' };
    const isObj = v => !!v && typeof v === 'object' && !Array.isArray(v);
    // enabled: true/false; «"true"», «так», 1 теж розуміємо (і просимо писати без лапок)
    function flag(v, what) {
        if (v == null || v === true || v === false) return v === true;
        let s = str(v).toLowerCase();
        let yes = ['true', 'так', 'yes', '1', 'on'].includes(s), no = ['false', 'ні', 'no', '0', 'off', ''].includes(s);
        if (yes || no) { if (s) issue(`${what}: enabled «${str(v)}» прочитано як ${yes} — пиши без лапок: ${yes}`); return yes; }
        issue(`${what}: enabled «${str(v)}» — не розумію, лишаю вимкненим (true або false)`); return false;
    }
    // Суми — гривні числом. «50 000 грн», «1 500,50», «50к», «50 тис» теж рахуємо, але просимо писати числом.
    function money(v, what) {
        if (v == null || v === '') return 0;
        if (typeof v === 'number') { if (isFinite(v) && v >= 0) return v; issue(`${what}: сума «${v}» — не може бути відʼємною`); return 0; }
        let s = str(v).toLowerCase().replace(/[\s\u00a0\u202f']/g, '').replace(/(грн|гривень|гривні|гривня|uah|₴)\.?$/, ''), k = 1, m;
        if ((m = s.match(/^(.+?)(k|к|тис\.?|тисяч)$/))) { s = m[1]; k = 1000; }
        if (/^\d{1,3}([.,]\d{3})+$/.test(s)) s = s.replace(/[.,]/g, '');   // 50,000 / 50.000 — розділювач тисяч, не копійки
        s = s.replace(',', '.');
        let n = /^\d+(\.\d+)?$/.test(s) ? Math.round(parseFloat(s) * k * 100) / 100 : NaN;
        if (!isFinite(n)) { issue(`${what}: не розумію суму «${str(v)}» — пиши числом у гривнях, напр. 50000`); return 0; }
        issue(`${what}: «${str(v)}» прочитано як ${fmtMoney(n)} — краще писати просто числом: ${n}`);
        return n;
    }
    function fmtMoney(n) { return new Intl.NumberFormat('uk-UA', { maximumFractionDigits: 0 }).format(Math.floor(n)) + ' ₴'; }
    // ID банки з посилання send.monobank.ua/jar/… — за ним GitHub Action підтягує суму (fundraisers.json)
    function jarOf(url) { let m = String(url || '').match(/send\.monobank\.ua\/jar\/([A-Za-z0-9]+)/); return m ? m[1] : ''; }
    const isSample = url => /^X+$/i.test(jarOf(url));
    function supLink(raw, what, label, isMembership) {
        if (raw == null) return null;
        if (typeof raw === 'string') raw = { enabled: true, url: raw };   // скорочено: просто посилання
        if (!isObj(raw)) { issue(`${what}: очікую обʼєкт {"enabled": …, "url": …}`); return null; }
        Object.keys(raw).forEach(k => { if (!LINK_KEYS.includes(k)) issue(`${what}: невідоме поле «${k}» — описка? Відомі: ${LINK_KEYS.join(', ')}`); });
        let enabled = flag(raw.enabled, what), url = normUrl(raw.url, what, 'кнопку сховано');
        // Канал YouTube без /join відкриває головну каналу, а не сторінку спонсорства — додаємо /join
        let m = isMembership && url.match(/^(https?:\/\/(?:www\.|m\.)?youtube\.com\/(?:channel\/UC[\w-]{22}|@[\w.\-]+|c\/[\w.\-]+))\/?(?:[?#].*)?$/i);
        if (m) { url = m[1] + '/join'; issue(`${what}: посилання на канал без /join — веду на сторінку спонсорства: ${url}`); }
        if (enabled && !url) issue(`${what}: увімкнено, але нема url — кнопку сховано`);
        return { enabled, url, label: str(raw.label) || label, about: str(raw.about) };
    }
    function normSupport(raw) {
        let out = { enabled: false, membership: null, donate: null, funds: [] };
        if (raw == null) return out;
        if (!isObj(raw)) { issue('seasons.json, support: очікую обʼєкт {"enabled": …, "membership": …, "fundraisers": […]}'); return out; }
        Object.keys(raw).forEach(k => { if (!SUP_KEYS.includes(k)) issue(`seasons.json, support: невідоме поле «${k}» — описка? Відомі: ${SUP_KEYS.join(', ')}`); });
        out.enabled = flag(raw.enabled, 'seasons.json, support');
        out.membership = supLink(raw.membership, 'seasons.json, support.membership', 'Стати спонсором', true);
        out.donate = supLink(raw.donate, 'seasons.json, support.donate', 'Підтримати', false);
        let list = raw.fundraisers == null ? [] : raw.fundraisers;
        if (isObj(list)) { issue('seasons.json, support.fundraisers: очікую список [ … ] — один збір теж беру в [ ]'); list = [list]; }
        if (!Array.isArray(list)) { issue('seasons.json, support.fundraisers: очікую список [ … ]'); list = []; }
        let ids = {};
        list.forEach((f, i) => {
            let what = `seasons.json, support.fundraisers №${i + 1}`;
            if (!isObj(f)) { issue(`${what}: це не обʼєкт {…} — пропускаю`); return; }
            Object.keys(f).forEach(k => { if (!FUND_KEYS.includes(k)) issue(`${what}: невідоме поле «${k}» — описка? Відомі: ${FUND_KEYS.join(', ')}`); });
            let title = str(f.title);
            if (title) what = `seasons.json, збір «${title}»`;
            let enabled = flag(f.enabled, what), url = normUrl(f.url, what, 'кнопку «Долучитися» сховано');
            let id = str(f.id).toLowerCase().replace(/[^\w\u0400-\u04ff-]+/g, '-').replace(/^-+|-+$/g, '') || 'zbir-' + (i + 1);
            if (ids[id]) { issue(`${what}: id «${id}» уже є в іншого збору`); id += '-' + (i + 1); }
            ids[id] = true;
            let kind = FUND_KINDS[str(f.kind).toLowerCase()] || '';
            if (str(f.kind) && !kind) issue(`${what}: kind «${str(f.kind)}» — невідомий (charity — благодійний, channel — на канал)`);
            let fund = { id, enabled, title, about: str(f.about), url, jar: jarOf(url), kind,
                goal: money(f.goal, what + ', goal'), raised: money(f.raised, what + ', raised'), until: normDate(f.until, what + ', until') };
            if (enabled) {                             // приклад-заготовку не лаємо, доки її не увімкнули
                if (!title) issue(`${what}: увімкнено, але нема title — збір сховано`);
                if (!url) issue(`${what}: увімкнено, але нема url — нема куди донатити, збір сховано`);
                else if (isSample(url)) issue(`${what}: у url ще приклад (…/jar/XXXXXXXXXX) — встав посилання на свою банку; збір сховано`);
            }
            out.funds.push(fund);
        });
        return out;
    }
    // Чому пункт НЕ видно глядачам ('' — видно). Для ?check і для рішення, що малювати.
    function linkWhy(l) {
        if (!l) return 'нема в seasons.json';
        if (!l.url) return 'нема url';
        if (!l.enabled) return 'вимкнено';
        return SUPPORT.enabled ? '' : 'вимкнено весь блок (support.enabled)';
    }
    function fundWhy(f, today) {
        if (!f.title) return 'нема title';
        if (!f.url || isSample(f.url)) return f.url ? 'у url ще приклад' : 'нема url';
        if (f.until && today > f.until) return 'завершився ' + fmtDay(f.until, true);
        if (!f.enabled) return 'вимкнено';
        return SUPPORT.enabled ? '' : 'вимкнено весь блок (support.enabled)';
    }
    // Сума з банки (fundraisers.json від GitHub Action) важливіша за raised із seasons.json; ціль — із seasons.json, інакше з банки
    function fundNow(f) {
        let l = f.jar && FUNDS_LIVE && FUNDS_LIVE.jars && FUNDS_LIVE.jars[f.jar];
        let live = isObj(l) && typeof l.raised === 'number' && isFinite(l.raised) && l.raised >= 0;
        return { raised: live ? l.raised : f.raised, goal: f.goal || (isObj(l) && +l.goal > 0 ? +l.goal : 0), live };
    }

    // ── Джерела даних ──────────────────────────────────────────────────────────
    function getFile(u) { return fetch(CHECK ? u + '?cb=' + Date.now() : u, { cache: CHECK ? 'no-store' : 'no-cache' }); }

    async function loadMode() {
        try {
            let r = await (BOOT.state || getFile('state.json'));
            if (!r.ok) return 'youtube';
            let d = await r.json();
            return (d && d.mode === 'doomsday') ? 'doomsday' : 'youtube';
        } catch(e) { return 'youtube'; }
    }

    // Зіпсована правка seasons.json не має класти сайт: беремо останню справну копію з кешу браузера.
    async function loadSeasons() {
        let raw;
        ISSUES = [];
        try {
            let r = await (BOOT.seasons || getFile('seasons.json'));
            if (!r.ok) throw new Error('HTTP ' + r.status);
            raw = parseLoose(await r.text());
            lsSet('ss_seasons', JSON.stringify(raw));
            SRC.seasons = 'seasons.json';
        } catch(e) {
            issue('seasons.json: ' + e.message);
            raw = lsJSON('ss_seasons', null);
            if (!raw) return false;
            SRC.seasons = 'остання справна копія з кешу браузера — сам файл зараз зіпсований!';
        }
        normConfig(raw);
        TOPIC = topicFromHash();
        return true;
    }

    // Швидкість: просимо в YouTube лише ті поля, які малюємо (відповідь у кілька разів легша)
    const PL_FIELDS = encodeURIComponent('nextPageToken,items(snippet(title,description,thumbnails,resourceId/videoId),contentDetails(videoId,videoPublishedAt),status/privacyStatus)');
    // Сторінки плейлиста (по 50) від token; maxPages — скільки взяти (Infinity — до кінця). next — токен решти.
    async function fetchPages(pid, token = '', maxPages = Infinity) {
        let items = [], pages = 0;
        do {
            let res = await fetch(`https://www.googleapis.com/youtube/v3/playlistItems?part=snippet,contentDetails,status&playlistId=${encodeURIComponent(pid)}&maxResults=50&fields=${PL_FIELDS}&key=${API_KEY}${token ? '&pageToken='+token : ''}`);
            let data = await res.json().catch(() => ({}));
            if (!res.ok || data.error) {
                let reason = ((data.error && data.error.errors && data.error.errors[0]) || {}).reason || '';
                let err = new Error((data.error && data.error.message) || ('HTTP ' + res.status));
                // Плейлиста нема / він приватний — це помилка в seasons.json, а не збій YouTube
                err.badPlaylist = res.status === 404 || reason === 'playlistNotFound' || reason === 'playlistItemsNotAccessible';
                throw err;
            }
            items.push(...(data.items || []));
            token = data.nextPageToken || '';
        } while (token && ++pages < maxPages);
        return { items, next: token };
    }

    // byPl може прийти з кешу браузера — довіряємо лише цілим записам
    function cleanList(list) { return Array.isArray(list) ? list.filter(r => r && r.key && DATE_RE.test(r.date)) : []; }
    function applyPlaylists(byPl) {
        EPS = {};
        SEASONS.forEach(s => { EPS[s.k] = cleanList(s.playlist && byPl[s.playlist]); });
        if (CAL) {                                     // календар: усе з джерела від start, крім відео з плейлистів-винятків (Shorts)
            let skip = new Set();
            CAL.exclude.forEach(pl => cleanList(byPl[pl]).forEach(r => skip.add(r.key)));
            EPS.cal = cleanList(CAL.playlist && byPl[CAL.playlist]).filter(r => !skip.has(r.key) && (!CAL.start || r.date >= CAL.start));
        }
    }

    // Мініатюри: браузер сам бере розмір під картку (320…1280 px) — телефон не тягне 1280, коли вистачає 640
    const THUMB_KEYS = ['medium', 'high', 'standard', 'maxres'];
    function thumbSet(t) {
        let src = (t.high || t.medium || t.standard || t.maxres || t.default || {}).url || '';
        let set = THUMB_KEYS.filter(k => t[k] && t[k].url && t[k].width).map(k => t[k].url + ' ' + t[k].width + 'w').join(', ');
        return { thumb: src, srcset: set };
    }

    // Відео плейлиста → записи. Дата — дата публікації відео (videoPublishedAt), а не додавання в плейлист.
    // Приватні, заплановані й видалені відео її не мають — пропускаємо й рахуємо для ?check.
    function parseItems(pid, items, meta, hidden) {
        hidden[pid] = 0;
        return items.reduce((out, i) => {
            let sn = i.snippet, cd = i.contentDetails || {};
            if (!sn || !cd.videoPublishedAt || (i.status || {}).privacyStatus === 'private') { hidden[pid]++; return out; }
            let vid = cd.videoId || (sn.resourceId || {}).videoId;
            let pd = parseDesc(sn.description);
            out.push(Object.assign({ key: vid, title: sn.title, y: vid, v: '', imp: pd.important, tags: tagsOf(sn.title, sn.description),
                date: localDay(cd.videoPublishedAt), ts: cd.videoPublishedAt }, thumbSet(sn.thumbnails || {})));
            meta[vid] = { title: sn.title, time: pd.time, body: pd.body, important: pd.important };
            return out;
        }, []);
    }
    // Свіжа перша сторінка + старіші відео з кешу (перша сторінка — головна для свого проміжку часу)
    function mergeOlder(fresh, cached) {
        let oldest = fresh.reduce((m, r) => r.ts < m ? r.ts : m, '\uffff'), have = new Set(fresh.map(r => r.key));
        return fresh.concat(cleanList(cached).filter(r => !have.has(r.key) && r.ts < oldest));
    }

    // Швидкість і квота YouTube API:
    //  • перша сторінка (50 відео) кожного плейлиста — паралельно, і сторінка малюється одразу;
    //  • решта сторінок довантажується фоном (після року щоденних відео це ~8 сторінок);
    //  • список завантажень (UU…, найновіші першими) при свіжому кеші (< доби) оновлюємо лише першою
    //    сторінкою, старіші відео — з кешу; повний перезбір — раз на добу.
    // Кривий ID одного плейлиста гасить лише свій блок; збій самого YouTube (квота, мережа) → фолбек на архів.
    let PL_CACHE = {}, YT_FULL = true;               // YT_FULL: цього разу все зібрано з YouTube, без доклеювання з кешу
    async function loadYouTube(cachedPl, cacheAge) {
        try {
            CAL_NOTE = '';
            let pls = [...new Set([...SEASONS.map(s => s.playlist), ...(CAL ? [CAL.playlist, ...CAL.exclude] : [])].filter(Boolean))];
            let pages = {};
            await Promise.all(pls.map(async pid => {
                try { pages[pid] = await fetchPages(pid, '', 1); }
                catch(e) {
                    if (!e.badPlaylist) throw e;
                    // Список завантажень (UU…) YouTube не віддає, поки на каналі нема жодного публічного відео — це не помилка
                    if (CAL && pid === CAL.playlist && /^UU/.test(pid)) CAL_NOTE = 'на каналі ще нема жодного публічного відео';
                    else issue(`плейлист ${pid} не знайдено або він закритий — перевір ID і доступ «Загальнодоступний»`);
                    pages[pid] = { items: [], next: '' };
                }
            }));
            let fresh = cachedPl && typeof cachedPl === 'object' && cacheAge < DAY_MS;
            let fromCache = pid => fresh && /^UU/.test(pid) && Array.isArray(cachedPl[pid]);
            let rest = pls.filter(pid => pages[pid].next && !fromCache(pid));
            YT_FULL = !pls.some(pid => pages[pid].next && fromCache(pid));
            const commit = () => {
                let byPl = {}, meta = {}, hidden = {};
                pls.forEach(pid => {
                    byPl[pid] = parseItems(pid, pages[pid].items, meta, hidden);
                    if (pages[pid].next && fromCache(pid)) byPl[pid] = mergeOlder(byPl[pid], cachedPl[pid]);
                });
                PL_CACHE = byPl; HIDDEN = hidden;
                metaById = Object.assign({}, metaById, meta);   // записки старіших відео лишаються з кешу
                applyPlaylists(byPl);
            };
            if (rest.length) {                          // перший екран — уже зараз, решта сторінок — фоном
                commit(); LOADING = false; render();
                await Promise.all(rest.map(async pid => {
                    let more = await fetchPages(pid, pages[pid].next);
                    pages[pid].items.push(...more.items); pages[pid].next = '';
                }));
            }
            commit();
            return true;
        } catch(e) {
            console.error('YouTube API error:', e.message);
            return false;
        }
    }

    // Судний день: читаємо локальний archive.json (незалежно від YouTube).
    // Форма (site_publisher): {base, days:{date:[{t,p,v,y,d,desc}]}}. Календар і сезони — за датою.
    async function loadArchive() {
        try {
            let res = await getFile('archive.json');
            if (!res.ok) throw new Error('HTTP ' + res.status);
            let data = await res.json();
            BASE = data.base || '';
            let eps = {}, meta = {}, days = data.days || {};
            Object.keys(days).forEach(date => {
                if (!DATE_RE.test(date) || !Array.isArray(days[date])) return;
                let s = SEASONS.find(x => (!x.start || date >= x.start) && (!x.end || date <= x.end));
                let inCal = CAL && (!CAL.start || date >= CAL.start);
                if (!s && !inCal) return;
                days[date].forEach((it, n) => {
                    let key = it.y || it.v || (date + '_' + n);
                    let pd = parseDesc(it.desc || '');
                    let rec = { key: key, title: it.t || '', y: it.y || '', v: it.v || '', tags: tagsOf(it.t, it.desc),
                        thumb: it.p || '', srcset: '', imp: pd.important, date: date, ts: date + 'T' + pad2(n) };
                    if (s) (eps[s.k] = eps[s.k] || []).push(rec);
                    if (inCal) (eps.cal = eps.cal || []).push(rec);
                    meta[key] = { title: it.t || '', time: pd.time, body: pd.body, important: pd.important };
                });
            });
            EPS = eps; metaById = meta;
            return true;
        } catch(e) {
            console.error('archive.json error:', e.message);
            return false;
        }
    }

    function showError() {
        document.getElementById('app').innerHTML = (CHECK ? checkHtml(todayStr()) : '') +
            '<div class="msg-empty">Не вдалось завантажити сторінку. Спробуйте оновити.</div>';
    }

    // Швидкість: повторний візит малюємо з кешу браузера миттєво — ще до жодного запиту; свіже підтягнеться слідом.
    let CACHED_PL = null;
    function renderFromCache() {
        if (CHECK) return false;
        let raw = lsJSON('ss_seasons', null), pl = lsJSON('ss_pl', null), t = +lsGet('ss_time') || 0;
        if (!raw || !pl || typeof pl !== 'object' || Date.now() - t > 30 * DAY_MS) return false;
        normConfig(raw);
        if (!SEASONS.length && !CAL) return false;
        TOPIC = topicFromHash();
        CACHED_PL = pl; applyPlaylists(pl); metaById = lsJSON('ss_meta', {}) || {};
        LOADING = false; SRC.eps = 'кеш браузера';
        render();
        return true;
    }

    async function init() {
        let hadCache = renderFromCache();
        let [mode, ok] = await Promise.all([loadMode(), loadSeasons()]);
        if (!ok) { if (!hadCache) showError(); return; }
        MODE = mode;
        if (MODE === 'doomsday') {                     // явний судний день зі state.json
            if (await loadArchive()) { LOADING = false; SRC.eps = 'archive.json (режим doomsday)'; render(); return; }
            MODE = 'youtube';                          // архів недоступний — пробуємо YouTube
        }
        if (CACHED_PL) applyPlaylists(CACHED_PL);
        render();                                      // свіжі шапки сезонів одразу; серії — з кешу або скелетом
        // «Свіжість» для інкрементного оновлення рахуємо від останнього ПОВНОГО перезбору (ss_full), а не від будь-якого візиту
        if (await loadYouTube(CACHED_PL, Date.now() - (+lsGet('ss_full') || 0))) {
            lsSet('ss_pl', JSON.stringify(PL_CACHE));
            lsSet('ss_meta', JSON.stringify(metaById));
            lsSet('ss_time', String(Date.now()));
            if (YT_FULL) lsSet('ss_full', String(Date.now()));
            SRC.eps = 'YouTube';
        } else if (CACHED_PL) {                        // YouTube мовчить (або нема інтернету), але в браузері є копія — лишаємо її
            SRC.eps = 'кеш браузера (YouTube не відповів)';
        } else if (await loadArchive()) {              // ⚑ YouTube мовчить і копії нема → авто-судний-день
            MODE = 'doomsday'; SRC.eps = 'archive.json (YouTube не відповів)';
        } else {                                       // показуємо все одно — без відео
            LOAD_FAILED = true; SRC.eps = 'нічого — YouTube і архів недоступні';
        }
        LOADING = false;
        render();
    }

    // ── Малювання ──────────────────────────────────────────────────────────────
    // Порядок: теми → вибрана тема → стіна днів → сезони (поточний → анонси → завершені).
    let LAST_HTML = '', SUP_HTML = '', HASH_DONE = false, DAY_DONE = '';
    function render() {
        // Телефон: на першому екрані одна картка — решта не повинна відбирати в неї канал; ширший екран — перший ряд
        PLAY = []; EAGER = matchMedia('(max-width:600px)').matches ? 1 : 3; FIRST_IMG = true;
        let today = todayStr(), rank = { live: 0, soon: 1, done: 2 };
        let html = (CHECK ? checkHtml(today) : '') + fundsHtml(today);
        if (CAL) html += homeHtml(today);
        if (!SEASONS.length) {
            if (!CAL) html += '<div class="msg-empty">Скоро тут зʼявиться перший сезон.</div>';
        } else {
            let list = SEASONS.map(s => ({ s, st: seasonState(s, today) })).sort((a, b) => rank[a.st] - rank[b.st] ||
                (a.st === 'soon' ? (a.s.start < b.s.start ? -1 : 1) : ((a.s.start || '') > (b.s.start || '') ? -1 : 1)));
            if (list.length > 1)                       // справжні якорі: клавіатура, «назад» у браузері, посилання на сезон
                html += '<nav class="nav-base" aria-label="Сезони">' + list.map(({ s }) =>
                    `<a class="nav-seg" href="#${s.id}">Сезон ${s.n}</a>`).join('') + '</nav>';
            list.forEach(({ s, st }) => { html += seasonHtml(s, st, today); });
        }
        let sup = supHeaderHtml();                     // кнопки підтримки в шапці (поза #app)
        if (sup !== SUP_HTML) { SUP_HTML = sup; let el = document.getElementById('sup'); if (el) el.innerHTML = sup; }
        loadFunds(today);
        if (html === LAST_HTML) return;                // нічого не змінилось — не чіпаємо DOM (без миготіння)
        LAST_HTML = html;
        let app = document.getElementById('app');
        let opened = [...app.querySelectorAll('details[open]')].map(d => d.id);
        app.innerHTML = html;
        opened.forEach(id => { let d = document.getElementById(id); if (d) d.open = true; });
        // Посилання на день (#d=2026-09-30, сюди ж ведуть сторінки /d/…/): показати день; на компʼютері — ще й відкрити відео
        let dh = dayFromHash();
        if (dh && dh !== DAY_DONE && !LOADING && document.getElementById('cal-' + dh)) {
            DAY_DONE = dh; HASH_DONE = true;
            setTimeout(() => showDay(dh, '', !OPEN_IN_APP), 0);
        }
        // Глибоке посилання (#s-2, #s-3-2026-09) — прокрутити, коли серії вже на місці (інакше макет ще «поїде»)
        if (!HASH_DONE && !LOADING && location.hash.length > 1) {
            let el = document.getElementById(decodeURIComponent(location.hash.slice(1)));
            if (el) {
                HASH_DONE = true;
                let d = el.closest('details'); if (d) d.open = true;
                el.scrollIntoView({ behavior: 'instant', block: 'start' });
            }
        }
    }

    // ── Підтримка: шапка, збори, рядок у плеєрі ──────────────────────────────────
    const HEART_SVG = '<svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 21s-7.5-4.6-9.6-9.3C.9 8.2 3 4.5 6.6 4.5c2.1 0 3.5 1.1 4.4 2.4.9-1.3 2.3-2.4 4.4-2.4 3.6 0 5.7 3.7 4.2 7.2C19.5 16.4 12 21 12 21z"/></svg>';
    const offTag = why => why ? ` <span class="off-tag">${esc(why.startsWith('вимкнено') ? 'вимкнено' : why)}</span>` : '';
    function supHeaderHtml() {
        return [['membership', HEART_SVG], ['donate', '']].map(([k, icon]) => {
            let l = SUPPORT[k], why = linkWhy(l);
            if (why && !(CHECK && l && l.url)) return '';   // глядач бачить лише увімкнене; ?check — усе з адресою
            return `<a class="sup-btn${why ? ' off' : ''}" data-sup="${k}" href="${esc(l.url)}" target="_blank" rel="noopener"` +
                (l.about ? ` title="${esc(l.about)}"` : '') + `>${icon}${esc(l.label)}${offTag(why)}</a>`;
        }).join('');
    }
    // Збори — над стіною днів, компактно: назва, навіщо, прогрес, «Долучитися». Після until — зникають самі.
    function fundsHtml(today) {
        let list = SUPPORT.funds.filter(f => !fundWhy(f, today) || (CHECK && f.title));
        if (!list.length) return '';
        return '<section class="funds" aria-label="Збори">' + list.map(f => {
            let why = fundWhy(f, today), n = fundNow(f), pct = n.goal ? Math.floor(n.raised / n.goal * 100) : 0;
            if (n.goal && n.raised > 0 && pct < 1) pct = 1;
            let year = f.until && f.until.slice(0, 4) !== today.slice(0, 4);
            let head = [f.kind === 'charity' ? 'Благодійний збір' : f.kind === 'channel' ? 'Збір на канал' : 'Збір',
                f.until ? 'до ' + fmtDay(f.until, year) : ''].filter(Boolean).join(' · ');
            let sum = n.goal ? `${fmtMoney(n.raised)} з ${fmtMoney(n.goal)} · ${pct}%` : n.raised ? 'Зібрано ' + fmtMoney(n.raised) : '';
            if (n.goal && n.raised >= n.goal) sum = 'Ціль досягнуто — дякую! · ' + sum;
            return `<div class="fund${why ? ' off' : ''}" id="f-${esc(f.id)}"><div class="fund-txt"><div class="fund-k">${esc(head)}${offTag(why)}</div>` +
                `<div class="fund-t">${esc(f.title)}</div>${f.about ? `<div class="fund-a">${esc(f.about)}</div>` : ''}</div>` +
                (n.goal ? `<div class="fund-bar" role="progressbar" aria-label="Зібрано" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${Math.min(pct, 100)}"><i style="width:${Math.min(pct, 100)}%"></i></div>` : '') +
                `<div class="fund-f"><span class="fund-s">${sum}</span>` +
                (f.url && !isSample(f.url) ? `<a class="fund-go" href="${esc(f.url)}" target="_blank" rel="noopener">Долучитися ↗</a>` : '') + '</div></div>';
        }).join('') + '</section>';
    }
    // У плеєрі (компʼютер) — один спокійний рядок: актуальний збір, а якщо його нема — платна підписка
    function noteSupHtml(today) {
        let f = SUPPORT.funds.find(x => !fundWhy(x, today)), m = SUPPORT.membership;
        if (f) return `<p class="note-sup">Зараз збираємо: ${esc(f.title)} — <a href="${esc(f.url)}" target="_blank" rel="noopener">долучитися ↗</a></p>`;
        if (m && !linkWhy(m)) return `<p class="note-sup">${m.about ? esc(m.about) + ' ' : ''}<a href="${esc(m.url)}" target="_blank" rel="noopener">${esc(m.label)} ↗</a></p>`;
        return '';
    }
    // Суми з банок: fundraisers.json (оновлює GitHub Action) — лише коли на сторінці є збір із банкою monobank
    let FUNDS_ASKED = false;
    function loadFunds(today) {
        if (FUNDS_ASKED || !SUPPORT.funds.some(f => f.jar && !isSample(f.url) && (!fundWhy(f, today) || CHECK))) return;
        FUNDS_ASKED = true;
        getFile('fundraisers.json').then(r => r.ok ? r.json() : null).then(d => {
            if (isObj(d) && isObj(d.jars)) { FUNDS_LIVE = d; LAST_HTML = ''; render(); }
        }).catch(() => {});
    }

    function ytHref(rec) { return rec.y ? 'https://www.youtube.com/watch?v=' + encodeURIComponent(rec.y) : '#'; }
    function imgTag(rec, cls, sizes) {
        if (!rec.thumb) return '';
        let load = EAGER-- > 0 ? (FIRST_IMG ? ' fetchpriority="high"' : '') : ' loading="lazy"';
        if (load) FIRST_IMG = false;
        return `<img src="${esc(rec.thumb)}"` + (rec.srcset ? ` srcset="${esc(rec.srcset)}" sizes="${sizes}"` : '') +
            (cls ? ` class="${cls}"` : '') + load + ' decoding="async" alt="">';
    }
    function epCount(n, total) {
        return total ? `Серій: ${n} / ${total}` : (n ? `${n} ${plural(n, 'серія', 'серії', 'серій')}` : '');
    }

    function seasonHtml(s, st, today) {
        let eps = (EPS[s.k] || []).slice().sort((a, b) => a.ts < b.ts ? -1 : a.ts > b.ts ? 1 : 0);
        let daily = s.format === 'daily';
        let stLbl = st === 'live' ? '<span class="s-live">Зараз</span>' : (st === 'soon' ? 'Скоро' : 'Завершено');
        let html = `<section class="season ${st} ${s.format}" id="${s.id}">` +
            `<div class="s-lbl">${s.title ? 'Сезон ' + s.n + (st === 'live' ? ' ' : ' · ') : ''}${stLbl}</div>` +
            `<h2 class="s-title">${esc(s.title || 'Сезон ' + s.n)}</h2>` +
            (s.about ? `<p class="s-about">${esc(s.about)}</p>` : '');

        let meta = [st === 'soon' ? 'Старт — ' + fmtDay(s.start, true) : esc(fmtRange(s))].filter(Boolean);
        if (st !== 'done' && s.schedule) meta.push(esc(s.schedule));
        if (s.playlist && st !== 'soon')
            meta.push(`<a href="https://www.youtube.com/playlist?list=${encodeURIComponent(s.playlist)}" target="_blank" rel="noopener">Плейлист на YouTube ↗</a>`);
        if (st !== 'done')
            meta.push(`<a href="${CHANNEL_URL}?sub_confirmation=1" target="_blank" rel="noopener">Підписатися ↗</a>`);
        if (s.support && st !== 'done')
            meta.push(`<a class="hot" href="${esc(s.support)}" target="_blank" rel="noopener">Підтримати сезон ↗</a>`);
        html += `<div class="s-meta">${meta.map(m => `<span>${m}</span>`).join('')}</div>`;

        if (st === 'soon') return html + '</section>';

        // Прогрес сезону — за часом (тижні / дні), тож він «живий» навіть до першої серії.
        if (st === 'live') {
            let left = '', bar = '';
            let cnt = LOADING && !eps.length ? '' : (daily ? (eps.length ? eps.length + ' відео' : '') : epCount(eps.length, s.episodes));
            if (s.start) {
                let passed = dayNum(today) - dayNum(s.start);
                if (s.end) {
                    let total = dayNum(s.end) - dayNum(s.start);
                    let pct = Math.max(2, Math.min(100, Math.round(passed / Math.max(1, total) * 100)));
                    if (daily) left = `День ${passed + 1} з ${total + 1}`;
                    else {
                        let weeks = Math.max(1, Math.round(total / 7));
                        left = `Тиждень ${Math.min(weeks, Math.floor(passed / 7) + 1)} з ${weeks}`;
                    }
                    bar = `<div class="prog-bar"><i style="width:${pct}%"></i></div>`;
                } else left = daily ? `День ${passed + 1}` : `Тиждень ${Math.floor(passed / 7) + 1}`;
            }
            if (left || cnt) html += `<div class="prog">${bar}<div class="prog-txt"><span>${left}</span><span>${cnt}</span></div></div>`;
        }

        if (LOAD_FAILED && !eps.length)
            return html + '<p class="s-msg">Не вдалось завантажити серії. Спробуйте оновити сторінку.</p></section>';
        if (LOADING && !eps.length && s.playlist)       // перший візит: YouTube ще думає
            return html + (daily ? '<div class="grid">' + '<div class="cell"></div>'.repeat(7) + '</div>'
                : '<div class="eps">' + '<div class="ep"><div class="ep-th sk"></div><div class="sk sk-l"></div><div class="sk sk-l"></div></div>'.repeat(3) + '</div>') + '</section>';

        return html + (daily ? dailyHtml(s, st, today, eps) : weeklyHtml(s, st, today, eps)) + '</section>';
    }

    // Головна: теми (коли вже є хештеги) → панель вибраної теми → стіна днів
    function homeHtml(today) {
        let s = CAL, soon = '<div class="s-lbl">Стіна днів</div><p class="cal-soon">Скоро тут зʼявиться перша стрічка.</p>';
        if (s.start && today < s.start)                // ще до першого дня — спокійна заглушка (без відліку й дедлайну)
            return `<section class="cal-home" id="cal">${soon}</section>`;
        let eps = (EPS.cal || []).slice().sort((a, b) => a.ts < b.ts ? -1 : a.ts > b.ts ? 1 : 0);
        let all = allRecs();
        let html = topicsBar(all) + topicPanel(all, today) +
            `<section class="cal-home${TOPIC ? ' filtering' : ''}" id="cal" aria-label="Стіна днів"><h2 class="sr-only">Стіна днів</h2>`;
        if (LOAD_FAILED && !eps.length) return html + '<p class="s-msg">Не вдалось завантажити відео. Спробуйте оновити сторінку.</p></section>';
        if (LOADING && !eps.length) return html + '<div class="sk sk-m"></div><div class="grid">' + '<div class="cell"></div>'.repeat(7) + '</div></section>';
        // Над стіною: 🎲 випадковий день (коли є з чого вибирати) і на телефоні «Сьогодні ↓» — місяць у дві колонки
        // займає кілька екранів (адресу й вибрану тему кнопка не чіпає)
        let acts = (eps.filter(r => r.y || r.v).length > 1 ? '<button type="button" class="act" onclick="randomDay()">🎲 Випадковий день</button>' : '') +
            (+today.slice(8) > 6 ? `<a class="act to-today" href="#cal-${today}" onclick="event.preventDefault();showDay('${today}')">Сьогодні ↓</a>` : '');
        // Відлік стіни — від дня першого відео (calendar.start лише відсікає старіші проби): без порожніх тижнів до старту
        let wall = eps.length ? dailyHtml(Object.assign({}, s, { start: eps[0].date }), 'live', today, eps) : '';
        return html + (wall && acts ? `<div class="cal-acts">${acts}</div>` : '') + (wall || soon) + '</section>';
    }

    // Усі відомі відео (календар + сезони) без дублів — для каталогу тем
    function allRecs() {
        let seen = new Set(), out = [];
        [EPS.cal || [], ...SEASONS.map(s => EPS[s.k] || [])].forEach(l => l.forEach(r => { if (!seen.has(r.key)) { seen.add(r.key); out.push(r); } }));
        return out;
    }
    function topicCounts(all) {                        // [[тема, {n, last}]] — найчастіші першими, далі найсвіжіші
        let m = {};
        all.forEach(r => recTopics(r).forEach(t => { let e = m[t] = m[t] || { n: 0, last: '' }; e.n++; if (r.ts > e.last) e.last = r.ts; }));
        return Object.entries(m).sort((a, b) => b[1].n - a[1].n || (a[1].last < b[1].last ? 1 : -1));
    }
    // Каталог тем — ряд «чипів» над календарем; вибрана тема — у адресі (#t=…), тож нею можна поділитися
    function topicsBar(all) {
        let list = topicCounts(all);
        if (!list.length) return '';
        // На компʼютері — 12 найчастіших тем, решта під «ще N» (щоб теми не відсували календар; вибрана — завжди видно)
        const MAX = 12, extra = list.length - MAX;
        return '<nav class="topics" aria-label="Теми"><span class="topics-lbl">Теми</span>' + list.map(([t, e], i) => {
            let on = t === TOPIC;
            return `<a class="chip${on ? ' on' : ''}${i >= MAX && !on ? ' extra' : ''}" href="${on ? '#' : '#t=' + encodeURIComponent(t)}"${on ? ' aria-current="true"' : ''}>${esc(topicLabel(t))}<span>${e.n}</span></a>`;
        }).join('') + (extra > 0 ? `<button type="button" class="chip more" onclick="this.parentNode.classList.add('all')">ще ${extra}</button>` : '') + '</nav>';
    }
    // Вибрана тема: усі її відео (найновіші першими) + календар нижче приглушує інші
    function topicPanel(all, today) {
        if (!TOPIC) return '';
        let list = all.filter(r => recTopics(r).includes(TOPIC)).sort((a, b) => a.ts < b.ts ? 1 : -1);
        let cfg = TOPICS.cfg[TOPIC] || {};
        let html = `<section class="topic" id="topic"><div class="s-lbl">Тема${list.length ? ' · ' + list.length + ' відео' : ''}</div>` +
            `<h2 class="s-title">${esc(topicLabel(TOPIC))}</h2>` + (cfg.about ? `<p class="s-about">${esc(cfg.about)}</p>` : '');
        let meta = list.length ? [esc(fmtRange({ start: list[list.length - 1].date, end: list[0].date }))] : [];
        meta.push('<a href="#">× Усі дні</a>');
        html += `<div class="s-meta">${meta.map(m => `<span>${m}</span>`).join('')}</div>`;
        if (!list.length) return html + '<p class="s-msg">Поки що нема відео з цією темою.</p></section>';
        let sizes = '(max-width:600px) 30vw, (max-width:1024px) 50vw, 340px';
        return html + '<div class="eps compact">' + list.map(rec => {
            let idx = PLAY.push({ key: rec.key, y: rec.y || '', v: rec.v || '', tags: rec.tags || [], date: rec.date, title: rec.title }) - 1;
            return `<a href="${ytHref(rec)}" class="ep${watched.includes(rec.key) ? ' watched' : ''}" data-k="${esc(rec.key)}" onclick="openVid(event, ${idx}, this)">` +
                `<div class="ep-th">${imgTag(rec, '', sizes)}${rec.imp ? STAR_SVG : ''}</div>` +
                `<div class="ep-k">${fmtDay(rec.date, rec.date.slice(0, 4) !== today.slice(0, 4))}</div>` +
                `<div class="ep-t">${esc(showTitle(rec.title))}</div></a>`;
        }).join('') + '</div></section>';
    }

    // Щотижневий формат: картки серій 01, 02, … + пунктирне місце наступної
    function weeklyHtml(s, st, today, eps) {
        let showNote = st === 'live';
        // Якість: мініатюра не менша за ~90% ширини картки в пікселях екрана (перевірено заміром різкості).
        // Велика картка на телефоні 3x бере 1280, на 2x — 640; на ноутбуці 640, бо 480 від YouTube помітно мʼякший.
        // Маленькі картки завершених сезонів і так отримують ≥ 1:1, тож беруть легші 320/480.
        let sizes = st === 'done' ? '(max-width:600px) 30vw, (max-width:1024px) 50vw, 340px'
            : '(max-width:600px) calc((100vw - 30px) * .9), (max-width:1024px) calc((100vw - 62px) / 2), 560px';
        let html = '<div class="eps">';
        eps.forEach((rec, i) => {
            let idx = PLAY.push({ key: rec.key, y: rec.y || '', v: rec.v || '', tags: rec.tags || [], date: rec.date, title: rec.title }) - 1;
            let body = (metaById[rec.key] || {}).body || '';
            let isNew = st === 'live' && i === eps.length - 1 && dayNum(today) - dayNum(rec.date) < 7;
            // Справжнє посилання на YouTube: Ctrl/Cmd-клік і середня кнопка відкривають відео в новій вкладці
            html += `<a href="${ytHref(rec)}" class="ep${watched.includes(rec.key) ? ' watched' : ''}" data-k="${esc(rec.key)}" onclick="openVid(event, ${idx}, this)">` +
                `<div class="ep-th">${imgTag(rec, '', sizes)}` +
                (isNew ? '<span class="ep-new">Нова</span>' : '') + (rec.imp ? STAR_SVG : '') + `</div>` +
                `<div class="ep-k">Серія ${pad2(i + 1)} · ${fmtDay(rec.date, rec.date.slice(0, 4) !== today.slice(0, 4))}</div>` +
                `<div class="ep-t">${esc(showTitle(rec.title))}</div>` +
                (showNote && body ? `<div class="ep-x">${esc(body.slice(0, 240))}</div>` : '') + `</a>`;
        });
        if (st === 'live' && (!s.episodes || eps.length < s.episodes)) {
            let n = eps.length + 1;
            html += `<div class="ep next"><div class="ep-th"><span>${pad2(n)}</span></div>` +
                `<div class="ep-k">Серія ${pad2(n)} · скоро</div>` +
                `<div class="ep-t">${eps.length ? 'Наступна серія' : 'Перша серія'}</div></div>`;
        }
        return html + '</div>';
    }

    // Щоденний формат: «стіна днів» по місяцях. Прожиті дні — клітинки (без відео — лише дата),
    // сьогодні без відео — пунктир «сьогодні», майбутнє не малюємо. Останні 2 місяці відкриті,
    // давніші — згорнуті в «Раніше» (довгий сезон не перетворює сторінку на нескінченну стрічку).
    function dailyHtml(s, st, today, eps) {
        let byDay = {};
        eps.forEach(rec => { (byDay[rec.date] = byDay[rec.date] || []).push(rec); });
        let first = s.start || (eps[0] && eps[0].date);
        if (!first) return '';
        let last = st === 'live' ? today : (s.end || (eps.length ? eps[eps.length - 1].date : today));
        if (s.end && last > s.end) last = s.end;
        if (last < first) return '';

        let months = [];
        for (let n = dayNum(first), end = dayNum(last); n <= end; n++) {
            let d = fromDayNum(n), ym = d.slice(0, 7);
            if (!months.length || months[months.length - 1].ym !== ym) months.push({ ym, days: [] });
            months[months.length - 1].days.push(d);
        }
        let sizes = '(max-width:600px) 30vw, (max-width:1024px) 25vw, 200px';
        let monthHtml = mo => {
            let [y, m] = mo.ym.split('-').map(Number);
            let h = `<div class="cal-mo" id="${s.id}-${mo.ym}"><h3 class="cal-hdr">${MONTHS[m - 1]}${String(y) !== today.slice(0, 4) ? ' ' + y : ''}</h3><div class="grid">`;
            mo.days.forEach((d, i) => {
                let w = new Date(dayNum(d) * DAY_MS).getUTCDay(), recs = byDay[d] || [], dn = +d.slice(8);
                if (w === 1 && i > 0) h += '<div class="week-divider"></div>';
                let dt = `<div class="dt"><span class="dt-n">${dn}</span><span class="dt-d">${WDAYS[w]}</span></div>`;
                let isToday = d === today && st === 'live', tid = ` id="${s.id}-${d}"`;   // id дня — для «Сьогодні ↓», випадкового дня й посилань #d=
                if (!recs.length) { h += `<div class="cell ${isToday ? 'today' : 'empty'}"${tid}>${dt}</div>`; return; }
                let links = recs.map(rec => {
                    let idx = PLAY.push({ key: rec.key, y: rec.y || '', v: rec.v || '', tags: rec.tags || [], date: rec.date, title: rec.title }) - 1;
                    let body = (metaById[rec.key] || {}).body || '';
                    let hit = TOPIC && recTopics(rec).includes(TOPIC) ? ' hit' : '';
                    return `<a href="${ytHref(rec)}" class="v-lnk${watched.includes(rec.key) ? ' watched' : ''}${hit}" data-k="${esc(rec.key)}" onclick="openVid(event, ${idx}, this)">` +
                        imgTag(rec, 'v-thumb', sizes) + (body ? `<div class="v-excerpt">${esc(body.slice(0, 160))}</div>` : '') +
                        `<div class="v-title">${esc(showTitle(rec.title))}</div></a>`;
                }).join('');
                h += `<div class="cell has-vid"${tid}><div class="v-cont${recs.length > 1 ? ' mult' : ''}">${links}</div>${dt}${recs.some(r => r.imp) ? STAR_SVG : ''}</div>`;
            });
            return h + '</div></div>';
        };
        let open = st === 'live' ? months.slice(-2) : [];
        let folded = st === 'live' ? months.slice(0, -2) : months;
        let openHtml = open.map(monthHtml).join('');
        EAGER = 0;                                     // мініатюри згорнутих місяців одразу не вантажимо
        let html = '';
        if (folded.length) {
            let cnt = folded.reduce((a, mo) => a + mo.days.reduce((b, d) => b + (byDay[d] || []).length, 0), 0);
            let label = st === 'live'
                ? `Раніше · ${folded.length} ${plural(folded.length, 'місяць', 'місяці', 'місяців')}`
                : `Календар сезону · ${months.length} ${plural(months.length, 'місяць', 'місяці', 'місяців')}`;
            html += `<details class="cal-old" id="${s.id}-old"><summary>${label} · ${cnt} відео</summary>${folded.map(monthHtml).join('')}</details>`;
        }
        return html + openHtml;
    }

    // Самоперевірка: taras.kyiv.ua/?check — що сайт зрозумів із seasons.json і чому якихось серій не видно.
    function checkHtml(today) {
        const stName = { live: 'йде зараз', soon: 'ще не почався', done: 'завершено' };
        let rows = '';
        if (CAL) {
            let n = (EPS.cal || []).length, h = HIDDEN[CAL.playlist] || 0, tl = topicCounts(allRecs());
            let first = (EPS.cal || []).reduce((m, r) => !m || r.date < m ? r.date : m, '');
            rows += `<li><b>Календар</b> — відлік від першого відео${first ? ' (' + fmtDay(first, true) + ')' : ' (його ще нема)'}` +
                (CAL.start ? `, старіші за ${fmtDay(CAL.start, true)} не беремо` : '') + `; джерело ${esc(CAL.playlist || '—')}: ` +
                `на сайті ${n} відео` + (h ? `, ще ${h} приховано (приватні / заплановані)` : '') +
                (CAL.exclude.length ? `; без відео з ${esc(CAL.exclude.join(', '))}` : '') + (CAL_NOTE ? ` — ${esc(CAL_NOTE)}` : '') +
                (CAL.start && today < CAL.start ? ` — ще не почався: до ${esc(fmtDay(CAL.start, true))} головна показує «Скоро тут зʼявиться перша стрічка»` : '') + '</li>' +
                `<li><b>Теми</b> — ${tl.length ? tl.map(([t, e]) => esc(topicLabel(t)) + ' (' + e.n + ')').join(', ') : 'поки жодного хештегу в назвах чи описах відео'}</li>`;
        }
        rows += SEASONS.map(s => {
            let n = (EPS[s.k] || []).length, h = HIDDEN[s.playlist] || 0;
            return `<li><b>Сезон ${s.n}</b> ${s.title ? '«' + esc(s.title) + '»' : '(без назви)'} — ${s.format === 'daily' ? 'щоденний' : 'щотижневий'}, ` +
                `${stName[seasonState(s, today)]}, ${esc(fmtRange(s) || 'без дат')}; ` + (s.playlist
                    ? `плейлист ${esc(s.playlist)}: на сайті ${n} ${plural(n, 'серія', 'серії', 'серій')}` +
                      (h ? `, ще ${h} приховано (приватні / заплановані / видалені)` : '')
                    : 'нема плейлиста') + `</li>`;
        }).join('');
        rows += supCheckRows(today);
        return `<div class="chk"><div class="chk-h">Перевірка сайту</div>` +
            `<p>Режим: ${esc(MODE)} · сезони: ${esc(SRC.seasons || '—')} · серії: ${esc(SRC.eps || '—')}</p>` +
            (rows ? `<ul>${rows}</ul>` : '') + `<div class="chk-h">Що виправити</div>` +
            (ISSUES.length ? `<ul>${ISSUES.map(m => `<li>${esc(m)}</li>`).join('')}</ul>` : '<p>✓ Помилок не знайдено.</p>') + `</div>`;
    }

    function supCheckRows(today) {
        let S = SUPPORT, rows = '', link = (name, l) => {
            let why = linkWhy(l);
            return `<li><b>${name}</b> — ${why ? esc(why) : '✓ на сайті'}${l && l.url ? ': ' + esc(l.url) : ''}</li>`;
        };
        if (!S.membership && !S.donate && !S.funds.length) return '';
        rows += `<li><b>Підтримка</b> — ${S.enabled ? 'увімкнено (support.enabled)' : 'вимкнено: глядачі не бачать нічого з цього; тут — попередній перегляд у пунктирних рамках'}</li>`;
        if (S.membership) rows += link('Платна підписка', S.membership);
        if (S.donate) rows += link('Підтримати', S.donate);
        S.funds.forEach(f => {
            let why = fundWhy(f, today), n = fundNow(f);
            let src = n.live ? `з банки (fundraisers.json, ${esc(FUNDS_LIVE.updated || 'час невідомий')})`
                : f.jar && !isSample(f.url) ? 'з seasons.json (raised) — живі суми з банки підтягує GitHub Action раз на годину' : 'з seasons.json (raised)';
            rows += `<li><b>Збір</b> «${esc(f.title || '—')}» (#f-${esc(f.id)}) — ${why ? esc(why) : '✓ на сайті'}; ` +
                `зібрано ${fmtMoney(n.raised)}${n.goal ? ' з ' + fmtMoney(n.goal) : ', без цілі'} — ${src}</li>`;
        });
        return rows;
    }

    // ── Плеєр ──────────────────────────────────────────────────────────────────
    // Телефон/планшет (iOS, iPadOS, Android): відео YouTube відкриваємо в застосунку YouTube
    // (нема застосунку — відкриється сайт YouTube). Компʼютер — вікно з плеєром і запискою на сайті.
    const UA = navigator.userAgent || '';
    const IS_ANDROID = /Android/i.test(UA);
    const IS_IOS = /iPhone|iPad|iPod/i.test(UA) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    const OPEN_IN_APP = IS_ANDROID || IS_IOS;
    window.openApp = window.openApp || (u => { location.href = u; });   // окремо — щоб перехід можна було перевірити тестом

    // Переглянуте: відмітка живе в localStorage цього браузера (ключ vw, спільний із calendar.html) і лишається
    // між візитами. Відмічаємо всі копії відео на сторінці (календар, тема, сезон) одразу.
    let askedPersist = false;
    function markWatched(key) {
        if (!key) return;
        if (!watched.includes(key)) { watched.push(key); lsSet('vw', JSON.stringify(watched)); }
        document.querySelectorAll('[data-k]').forEach(el => { if (el.dataset.k === key) el.classList.add('watched'); });
        // Просимо браузер не стирати сховище під час нестачі місця (Chrome/Safari вирішують тихо; Firefox питав би — не чіпаємо)
        if (!askedPersist && !/Firefox/i.test(UA)) {
            askedPersist = true;
            try { navigator.storage.persisted().then(p => p || navigator.storage.persist()).catch(() => {}); } catch(e) {}
        }
    }
    // Відмітили в іншій вкладці — оновлюємо й тут
    window.addEventListener('storage', e => {
        if (e.key !== 'vw') return;
        watched = lsJSON('vw', []); if (!Array.isArray(watched)) watched = [];
        LAST_HTML = ''; render();
    });

    // Прогрів: при першому наведенні/дотику на відео заздалегідь відкриваємо з'єднання з YouTube — плеєр стартує швидше
    let warmed = OPEN_IN_APP;                         // на телефоні плеєр на сайті не відкривається — гріти нічого
    function warm(e) {
        if (warmed || !e.target.closest || !e.target.closest('.ep,.v-lnk')) return;
        warmed = true;
        let l = document.createElement('link'); l.rel = 'preconnect'; l.href = 'https://www.youtube.com';
        document.head.appendChild(l);
    }
    document.addEventListener('pointerover', warm, { passive: true });
    document.addEventListener('focusin', warm);

    let lastFocus = null;
    window.openVid = function(e, idx, el) {
        if (e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;   // Ctrl/Cmd-клік — браузер відкриє YouTube у новій вкладці
        let p = PLAY[idx] || {};
        markWatched(p.key);
        let hasLocal = !!(BASE && p.v);
        if (OPEN_IN_APP && p.y && !hasLocal) {
            // iOS: звичайний перехід за посиланням youtube.com — система сама відкриє застосунок (Universal Link).
            // Android: intent — застосунок YouTube, а якщо його нема — сторінка відео в браузері.
            if (IS_ANDROID) {
                e.preventDefault();
                let web = 'https://www.youtube.com/watch?v=' + encodeURIComponent(p.y);
                openApp('intent://www.youtube.com/watch?v=' + encodeURIComponent(p.y) +
                    '#Intent;scheme=https;package=com.google.android.youtube;S.browser_fallback_url=' + encodeURIComponent(web) + ';end');
            }
            return;
        }
        e.preventDefault();
        // Записка серії під плеєром (щоденник): текст веде, штамп часу — підпис знизу; зірка, якщо важливо.
        let meta = metaById[p.key] || {};
        let note = document.getElementById('modNote');
        let topics = recTopics(p);                     // теми відео — чипи під запискою, клік відкриває тему
        note.innerHTML = ((meta.time || meta.body)
            ? `<div class="note-card${meta.important ? ' imp' : ''}">` +
              (meta.important ? STAR_SVG : '') +
              (meta.body ? `<div class="note-body">${esc(meta.body)}</div>` : '') +
              (meta.time ? `<div class="note-foot">🕒 ${esc(meta.time)}</div>` : '') + `</div>`
            : '') + ((topics.length || p.date) ? '<div class="note-tags">' +
              (p.date ? `<button type="button" class="chip share" onclick="shareDay('${p.date}', this)">🔗 Посилання на день</button>` : '') +
              topics.map(t => `<a class="chip" href="#t=${encodeURIComponent(t)}">${esc(topicLabel(t))}</a>`).join('') + '</div>' : '') +
            noteSupHtml(todayStr());
        // Плеєр: локальне відео (судний день, Фаза 5) якщо є base+v, інакше YouTube-ембед за id.
        let iframe = document.getElementById('ytIframe'), loc = document.getElementById('locVideo');
        let local = hasLocal ? (BASE.replace(/\/+$/, '') + '/' + p.v.replace(/^\/+/, '')) : '';
        if (local) {
            iframe.src = ''; iframe.style.display = 'none';
            loc.src = local; loc.style.display = 'block'; try { loc.play(); } catch(_) {}
        } else if (p.y) {
            try { loc.pause(); } catch(_) {} loc.removeAttribute('src'); loc.style.display = 'none';
            iframe.style.display = 'block'; iframe.src = 'https://www.youtube.com/embed/' + p.y + '?autoplay=1';
        } else {                                        // нема чим грати — постер+записка (Фаза 5 дасть відео)
            iframe.src = ''; iframe.style.display = 'none';
            try { loc.pause(); } catch(_) {} loc.removeAttribute('src'); loc.style.display = 'none';
        }
        lastFocus = el || document.activeElement;
        document.getElementById('vidModal').classList.add('show');
        document.getElementById('modIn').scrollTop = 0;
        document.body.style.overflow = 'hidden';
        document.querySelector('#vidModal .close').focus({ preventScroll: true });
    }

    window.closeModal = function() {
        let modal = document.getElementById('vidModal');
        if (!modal.classList.contains('show')) return;
        let iframe = document.getElementById('ytIframe'), loc = document.getElementById('locVideo');
        iframe.src = '';
        try { loc.pause(); } catch(_) {} loc.removeAttribute('src');
        modal.classList.remove('show');
        document.body.style.overflow = '';
        document.getElementById('modIn').style.transform = '';
        if (lastFocus && lastFocus.isConnected) lastFocus.focus({ preventScroll: true });   // фокус — туди, звідки відкрили
    }

    // Показати день на стіні: розгорнути «Раніше», прокрутити, коротко підсвітити; open — ще й відкрити відео
    // (той самий клік по плитці: компʼютер — вікно, телефон — застосунок YouTube)
    window.showDay = function(date, key, open) {
        let cell = document.getElementById('cal-' + date);
        if (!cell) return false;
        let det = cell.closest('details'); if (det) det.open = true;
        cell.scrollIntoView({ behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block: 'center' });
        cell.classList.remove('flash'); void cell.offsetWidth; cell.classList.add('flash');
        if (open) {
            let a = [...cell.querySelectorAll('a.v-lnk')].find(x => !key || x.dataset.k === key);
            if (a) a.click();
        }
        return true;
    };
    // 🎲 Випадковий день — з усієї стіни, а якщо вибрано тему, то з її відео; двічі поспіль той самий не випадає
    let lastRandom = '';
    window.randomDay = function() {
        let pool = (EPS.cal || []).filter(r => r.y || r.v);
        if (TOPIC) { let inTopic = pool.filter(r => recTopics(r).includes(TOPIC)); if (inTopic.length) pool = inTopic; }
        if (pool.length > 1) pool = pool.filter(r => r.key !== lastRandom);
        if (!pool.length) return;
        let rec = pool[Math.floor(Math.random() * pool.length)];
        lastRandom = rec.key;
        showDay(rec.date, rec.key, true);
    };
    // 🔗 Посилання на день: /d/РРРР-ММ-ДД/ — гарне прев'ю в Telegram (сторінку генерує архів на GitHub);
    // на телефоні — системне меню «Поділитися», на компʼютері — копія в буфер обміну
    window.shareDay = async function(date, btn) {
        let url = location.origin + '/d/' + date + '/';
        try {
            if (navigator.share && OPEN_IN_APP) { await navigator.share({ url }); return; }
            await navigator.clipboard.writeText(url);
            if (btn) { let t = btn.textContent; btn.textContent = '✓ Скопійовано'; setTimeout(() => { btn.textContent = t; }, 2000); }
        } catch(e) {
            if (e && e.name === 'AbortError') return;          // людина сама закрила меню «Поділитися»
            window.prompt('Посилання на цей день:', url);
        }
    };

    // 📱 Застосунок на головному екрані (PWA): офлайн-копія сторінки; на iPhone застосунок із головного екрана
    // не потрапляє під 7-денне стирання сховища Safari — відмітки «переглянуто» не губляться.
    if ('serviceWorker' in navigator && window.isSecureContext)
        addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
    // Кнопка «Встановити» — там, де браузер це вміє (Chrome, Edge, Android). На iPhone: «Поділитися → На початковий екран».
    let installEvt = null;
    addEventListener('beforeinstallprompt', e => { e.preventDefault(); installEvt = e; document.getElementById('install').hidden = false; });
    addEventListener('appinstalled', () => { installEvt = null; document.getElementById('install').hidden = true; });
    window.installApp = async function() {
        if (!installEvt) return;
        installEvt.prompt();
        try { await installEvt.userChoice; } catch(e) {}
        installEvt = null; document.getElementById('install').hidden = true;
    };

    document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });
    // Вибір теми живе в адресі (#t=…): «назад» у браузері повертає попередній вибір, посиланням можна поділитися
    window.addEventListener('hashchange', () => {
        let d = dayFromHash();
        if (d && d !== DAY_DONE) { DAY_DONE = d; closeModal(); showDay(d, '', !OPEN_IN_APP); return; }
        let t = topicFromHash();
        if (t === TOPIC) return;
        TOPIC = t; closeModal(); render();
        if (t) { let el = document.getElementById('topic'); if (el) el.scrollIntoView({ block: 'start' }); }
    });

    let tY = 0, mod = document.getElementById('vidModal'), mIn = document.getElementById('modIn');
    mod.addEventListener('touchstart', e => tY = e.touches[0].clientY, {passive:true});
    mod.addEventListener('touchmove', e => { let dY = e.touches[0].clientY - tY; if(dY>0 && mIn.scrollTop<=0) mIn.style.transform = `translateY(${dY}px)`; }, {passive:true});
    mod.addEventListener('touchend', e => { if(e.changedTouches[0].clientY - tY > 100) closeModal(); else mIn.style.transform = ''; }, {passive:true});

    init();
</script>
</body>
</html>
