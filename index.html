<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тарас Максимʼяк</title>
    <meta name="description" content="Щоденні стрічки Тараса Максимʼяка. Одне відео про кожен день, який більше не повториться.">

    <meta property="og:title" content="Taras Maksymiak">
    <meta property="og:description" content="Щодня — одна стрічка про день, який більше не повториться.">
    <meta property="og:image" content="https://taras.kyiv.ua/image.png">
    <meta property="og:url" content="https://taras.kyiv.ua/">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="color-scheme" content="light dark">
    <!-- 📱 Застосунок на головному екрані (PWA) -->
    <link rel="manifest" href="manifest.webmanifest">
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#121212" media="(prefers-color-scheme: dark)">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Лови день">

    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌓</text></svg>">
    <link rel="preconnect" href="https://www.googleapis.com" crossorigin>
    <link rel="preconnect" href="https://i.ytimg.com">
    <script>
        // Швидкість: сезони й режим запитуємо ще до розбору решти сторінки — паралельно з HTML.
        // Звичайний візит бере файл із CDN (перевірка ETag), ?check — завжди свіжий, повз кеші.
        (function () {
            var chk = /[?&]check\b/.test(location.search);
            function get(u) {
                var p = fetch(chk ? u + '?cb=' + Date.now() : u, { cache: chk ? 'no-store' : 'no-cache' });
                p.catch(function () {});            // помилку обробить основний скрипт
                return p;
            }
            try { window.BOOT = { seasons: get('seasons.json'), state: get('state.json') }; } catch (e) { window.BOOT = {}; }
        })();
    </script>
    <style>
        :root{--bg:#fff;--txt:#222;--cell:#f8f8f8;--mut:#6f6f6f;--div:#eaeaea;--red:#e62117;--day:#c4c4c4}
        @media (prefers-color-scheme:dark){:root{--bg:#121212;--txt:#e0e0e0;--cell:#1e1e1e;--mut:#aaa;--div:#333;--day:#5a5a5a}}
        html{scroll-behavior:smooth}
        body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--txt);margin:0;padding:20px 20px 0;overflow-x:hidden}
        :focus-visible{outline:2px solid var(--red);outline-offset:3px;border-radius:4px}
        .wrap{max-width:1400px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
        .main{flex:1;min-height:100vh}   /* підвал одразу нижче першого екрана — не «їде» вниз, коли зʼявляється календар (CLS) */
        .intro{margin:10px 0 50px}
        .intro .name{font-size:14px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--mut);margin:0 0 18px}
        .intro .links{display:flex;flex-wrap:wrap;gap:10px}
        /* Іконки без підписів: символи впізнавані самі по собі (05.08.2026) */
        .intro .links a{display:inline-flex;align-items:center;justify-content:center;text-decoration:none;padding:10px;border-radius:8px;transition:.2s}
        .intro .links a.primary{background:var(--txt);color:var(--bg)}
        .intro .links a.primary:hover{background:var(--red)}
        .intro .links a.ghost{color:var(--mut);border:1px solid var(--div)}
        .intro .links a.ghost:hover{color:var(--red);border-color:var(--red)}
        .nav-base{background:var(--cell);border-radius:8px;display:flex;border:1px solid var(--div);margin-bottom:50px;overflow-x:auto;scrollbar-width:none}
        .nav-base::-webkit-scrollbar{display:none}
        .nav-seg{flex:1 0 auto;white-space:nowrap;text-align:center;font-size:11px;font-weight:700;color:var(--mut);text-decoration:none;text-transform:uppercase;letter-spacing:1px;padding:12px 10px;transition:.2s;-webkit-tap-highlight-color:transparent}
        .nav-seg:hover{color:var(--red)}

        /* ── Сезон: одна велика тема ── */
        .season{margin:0 0 100px;scroll-margin-top:20px}
        .s-lbl{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--mut);margin-bottom:16px}
        .s-live{display:inline-flex;align-items:center;gap:7px;color:var(--red)}
        .s-live::before{content:'';width:8px;height:8px;border-radius:50%;background:var(--red);animation:pulse 2s ease-in-out infinite}
        @keyframes pulse{50%{opacity:.25}}
        .s-title{font-size:48px;font-weight:800;line-height:1.02;letter-spacing:-1px;margin:0 0 18px;overflow-wrap:anywhere}
        .season.live .s-title{font-size:72px;letter-spacing:-2.5px}
        .s-about{font-size:17px;line-height:1.55;color:var(--mut);max-width:640px;margin:0 0 22px;white-space:pre-line}
        .s-meta{display:flex;flex-wrap:wrap;gap:6px 22px;font-size:13px;font-weight:600;letter-spacing:.3px;color:var(--mut);margin-bottom:26px}
        .s-meta a{color:inherit;text-decoration:none;transition:.2s;display:inline-block;padding:6px 0;margin:-6px 0}
        .s-meta a:hover,.s-meta a.hot{color:var(--red)}
        .prog{max-width:640px;margin:0 0 44px}
        .prog-bar{height:4px;background:var(--div);border-radius:2px;overflow:hidden}
        .prog-bar i{display:block;height:100%;background:var(--red);border-radius:2px}
        .prog-txt{display:flex;justify-content:space-between;gap:12px;margin-top:10px;font-size:11px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--mut);font-variant-numeric:tabular-nums}

        /* ── Щотижневий формат: картки серій ── */
        .eps{display:grid;grid-template-columns:repeat(3,1fr);gap:34px 22px}
        .season.done .eps{grid-template-columns:repeat(4,1fr);gap:26px 16px}
        .ep{display:block;color:inherit;text-decoration:none;min-width:0}
        .ep-th{position:relative;aspect-ratio:16/9;border-radius:8px;overflow:hidden;background:var(--cell);transform:translateZ(0)}
        .ep-th img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .4s}
        .ep:hover .ep-th img{transform:scale(1.03)}
        .ep-new{position:absolute;top:10px;left:10px;z-index:15;background:var(--red);color:#fff;font-size:10px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;padding:4px 8px;border-radius:4px}
        .ep-k{margin-top:14px;font-size:11px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--mut);font-variant-numeric:tabular-nums}
        .ep-t{margin-top:6px;font-size:18px;font-weight:700;line-height:1.3;transition:color .2s;overflow-wrap:anywhere}
        .ep:hover .ep-t{color:var(--red)}
        .season.done .ep-t{font-size:15px}
        .ep-x{margin-top:8px;font-family:Georgia,'Times New Roman',serif;font-size:14px;line-height:1.55;color:var(--mut);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
        /* Переглянута серія — як на YouTube: червона смужка знизу й приглушений кадр (хрест лишився за календарем днів) */
        .ep.watched .ep-th img{filter:grayscale(.85);opacity:.75}
        .ep.watched .ep-th::after{content:'';position:absolute;left:0;right:0;bottom:0;height:4px;background:var(--red);z-index:20}
        .ep.watched .ep-k::after{content:' · переглянуто';color:var(--red)}
        /* Наступна серія: пунктирне місце — сезон триває, а не «порожньо» */
        .ep.next .ep-th{background:transparent;border:2px dashed var(--div);display:flex;align-items:center;justify-content:center}
        .ep.next .ep-th span{font-size:64px;font-weight:800;letter-spacing:-2px;color:var(--div)}
        .ep.next .ep-t,.ep.next:hover .ep-t{color:var(--mut)}
        /* Скелет, поки відповідає YouTube (перший візит) */
        .sk{background:var(--cell);border-radius:6px}
        .sk-l{height:12px;width:45%;margin-top:14px}
        .sk-l+.sk-l{width:70%;height:16px;margin-top:10px}
        .sk-m{width:140px;height:23px;margin:0 0 16px}    /* як заголовок місяця .cal-hdr */
        .sk-a{width:120px;height:13px;margin-bottom:18px}
        .sk-b{width:min(520px,80%);height:64px;margin-bottom:24px}
        .sk-c{width:min(640px,90%);height:14px;margin-bottom:44px}
        .s-msg{font-size:15px;color:var(--mut)}
        .msg-empty{text-align:center;padding:60px 20px;color:var(--mut)}

        /* ── Щоденний формат: «стіна днів» (як у calendar.html, але всередині сезону) ── */
        .cal-mo{margin:0 0 40px;scroll-margin-top:20px;content-visibility:auto;contain-intrinsic-size:auto 640px}
        .cal-hdr{color:var(--mut);font-size:20px;font-weight:500;text-transform:uppercase;letter-spacing:1px;margin:0 0 16px}
        .cal-old{margin:0 0 40px}
        .cal-old>summary{cursor:pointer;list-style:none;display:inline-flex;align-items:center;gap:10px;font-size:12px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--mut);padding:11px 16px;border:1px solid var(--div);border-radius:8px;background:var(--cell);transition:color .2s}
        .cal-old>summary::-webkit-details-marker{display:none}
        .cal-old>summary::before{content:'▸';transition:transform .2s}
        .cal-old[open]>summary{margin-bottom:34px}
        .cal-old[open]>summary::before{transform:rotate(90deg)}
        .cal-old>summary:hover{color:var(--red)}
        .grid{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
        .cell{aspect-ratio:16/9;position:relative;background:var(--cell);border-radius:6px;overflow:hidden}
        /* Порожній день не тримає місце під кадр: тиждень без відео стискається до смужки з датами,
           тож рідкі відео не перетворюють місяць на стіну порожнечі (особливо на телефоні) */
        .cell.empty{background:transparent;aspect-ratio:auto;min-height:34px}
        .cell.today{background:transparent;border:2px dashed var(--div);box-sizing:border-box}
        .cell.today::after{content:'сьогодні';position:absolute;inset:0;display:flex;align-items:flex-end;justify-content:flex-start;padding:0 0 8px 10px;font-size:10px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--mut)}
        .week-divider{grid-column:1/-1;height:2px;background:var(--div);border-radius:2px;margin:8px 0}
        .dt{position:absolute;top:8px;left:10px;display:flex;align-items:baseline;gap:6px;z-index:10;pointer-events:none}
        .dt-n{font-size:18px;font-weight:800;line-height:1;color:var(--day)}
        .dt-d{font-size:10px;font-weight:500;text-transform:uppercase;color:var(--day)}
        .cell.today .dt-n,.cell.today .dt-d{color:var(--red)}
        .has-vid .dt-n,.has-vid .dt-d{color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.9)}
        .v-cont{position:absolute;inset:0;display:flex;z-index:5}
        .v-lnk{position:relative;flex:1;height:100%;display:block;overflow:hidden;text-decoration:none}
        .v-cont.mult .v-lnk:not(:last-child){border-right:2px solid var(--bg)}
        .v-thumb{width:100%;height:100%;object-fit:cover;display:block}
        .v-lnk::after{content:'';position:absolute;inset:0;background:linear-gradient(to bottom,rgba(0,0,0,.4) 0%,transparent 40%,rgba(0,0,0,.9) 100%);pointer-events:none}
        .v-title{position:absolute;bottom:10px;left:10px;right:10px;color:#fff;font-size:11px;font-weight:500;text-shadow:0 1px 2px #000;z-index:10;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
        /* Уривок записки на плитці — лише на desktop (наведення); стіна в спокої чиста */
        .v-excerpt{position:absolute;left:10px;right:10px;bottom:30px;color:#fff;font-family:Georgia,'Times New Roman',serif;font-size:10.5px;line-height:1.4;z-index:9;opacity:0;transform:translateY(6px);transition:opacity .25s,transform .25s;pointer-events:none;text-shadow:0 1px 3px rgba(0,0,0,.95);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
        @media (hover:hover) and (pointer:fine){
            .v-lnk:hover .v-excerpt{opacity:1;transform:translateY(0)}
            .v-lnk:hover::after{background:linear-gradient(to bottom,rgba(0,0,0,.35) 0%,transparent 28%,rgba(0,0,0,.92) 82%)}
        }
        /* Переглянутий день закреслено — метафора календаря-лічильника */
        .v-lnk.watched .v-thumb{filter:grayscale(1) opacity(0.8)}
        .v-lnk.watched::before,.v-lnk.watched::after{content:'';position:absolute;top:50%;left:50%;width:150%;height:3px;background:var(--red);z-index:20;pointer-events:none;box-shadow:0 0 5px rgba(0,0,0,.3)}
        .v-lnk.watched::before{transform:translate(-50%,-50%) rotate(45deg)}
        .v-lnk.watched::after{transform:translate(-50%,-50%) rotate(-45deg)}

        /* ── Головна: каталог тем (хештеги) + стіна днів ── */
        .sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
        .topics{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:0 0 36px}
        .topics-lbl{font-size:11px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--mut);margin-right:6px}
        .chip{display:inline-flex;align-items:center;gap:7px;min-height:36px;box-sizing:border-box;padding:7px 14px;border:1px solid var(--div);border-radius:999px;font-size:13px;font-weight:600;color:var(--txt);text-decoration:none;background:var(--bg);transition:.2s;white-space:nowrap}
        .chip span{font-size:11px;color:var(--mut);font-variant-numeric:tabular-nums}
        .chip:hover{border-color:var(--red);color:var(--red)}
        .chip.on{background:var(--red);border-color:var(--red);color:#fff}
        .chip.on span{color:#fff;opacity:.85}
        .topic{margin:0 0 60px;scroll-margin-top:20px}
        .eps.compact{grid-template-columns:repeat(4,1fr);gap:26px 16px}
        .eps.compact .ep-t{font-size:15px}
        .cal-home{scroll-margin-top:20px;position:relative}
        .topics:not(.all) .chip.extra,.topics.all .chip.more{display:none}
        .chip.more{font:inherit;font-size:13px;font-weight:600;color:var(--mut);cursor:pointer}
        /* Дії над стіною (праворуч від назви місяця): 🎲 випадковий день, «Сьогодні ↓» (лише телефон/планшет) */
        .cal-acts{position:absolute;top:0;right:0;z-index:20;display:flex;gap:18px;align-items:center}
        .act{background:none;border:0;padding:6px 0;font:inherit;font-size:11px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--mut);cursor:pointer;text-decoration:none;transition:color .2s}
        .act:hover{color:var(--red)}
        .to-today{display:none;color:var(--red)}
        @media(max-width:1024px){.to-today{display:inline-block}}
        /* День, до якого перейшли (випадковий / за посиланням) — коротко підсвічується */
        .cell.flash{animation:flash 1.4s ease-out 2}
        @keyframes flash{0%{box-shadow:0 0 0 3px var(--red)}100%{box-shadow:0 0 0 3px transparent}}
        .install{display:block;margin-top:6px;padding:0;background:none;border:0;font:inherit;font-size:11px;letter-spacing:.5px;color:var(--mut);opacity:.6;cursor:pointer}
        .install:hover{opacity:1;color:var(--red)}
        .install[hidden]{display:none}
        .cal-soon{font-size:17px;color:var(--mut);margin:14px 0 0}
        /* Вибрана тема: у календарі приглушено відео інших тем — видно, коли тема «жила» */
        .cal-home.filtering .v-lnk:not(.hit){opacity:.18;filter:grayscale(1)}
        .note-tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
        .note-tags .chip{background:transparent;color:#fff;border-color:rgba(255,255,255,.35)}
        .note-tags .chip:hover{color:#fff;border-color:var(--red);background:var(--red)}
        .note-tags .chip.share{font:inherit;font-size:13px;font-weight:600;cursor:pointer}

        /* ── Підтримка (seasons.json → support): кнопки в шапці, збори над стіною, рядок у плеєрі. Типово вимкнено ── */
        .sup{display:contents}
        .intro .links a.sup-btn{gap:8px;min-height:38px;box-sizing:border-box;padding:9px 14px;border:1px solid var(--div);color:var(--txt);font-size:12px;font-weight:700;letter-spacing:1px;text-transform:uppercase}
        .intro .links a.sup-btn:hover{color:var(--red);border-color:var(--red)}
        .sup-btn svg{color:var(--red);flex:none}
        .intro .links a.sup-btn.off,.fund.off{border:1px dashed var(--red);opacity:.75}
        .off-tag{font-size:10px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:var(--red)}
        .funds{display:grid;gap:12px;margin:0 0 36px}
        .fund{display:grid;grid-template-columns:minmax(0,1fr) minmax(220px,340px);grid-template-areas:"txt bar" "txt foot";gap:10px 36px;align-items:center;background:var(--cell);border:1px solid var(--div);border-left:3px solid var(--red);border-radius:10px;padding:16px 20px;scroll-margin-top:20px}
        .fund-txt{grid-area:txt;min-width:0}
        .fund-k{font-size:11px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--mut)}
        .fund-t{font-size:18px;font-weight:700;line-height:1.3;margin-top:4px;overflow-wrap:anywhere}
        .fund-a{font-size:14px;line-height:1.45;color:var(--mut);margin-top:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
        .fund-bar{grid-area:bar;align-self:end;height:8px;border-radius:99px;background:var(--div);overflow:hidden}
        .fund-bar i{display:block;height:100%;background:var(--red);border-radius:inherit}
        .fund-f{grid-area:foot;align-self:start;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 12px}
        .fund-s{font-size:13px;font-variant-numeric:tabular-nums}
        .fund-go{display:inline-flex;align-items:center;min-height:38px;box-sizing:border-box;padding:9px 14px;border-radius:8px;background:var(--red);color:#fff;font-size:12px;font-weight:700;letter-spacing:1px;text-transform:uppercase;text-decoration:none;white-space:nowrap}
        .fund-go:hover{background:var(--txt);color:var(--bg)}
        .note-sup{margin:14px 0 0;font-size:14px;line-height:1.5;color:rgba(255,255,255,.75)}
        .note-sup a{color:#fff;font-weight:700;text-decoration:underline;text-decoration-color:var(--red);text-underline-offset:3px}
        .note-sup a:hover{color:var(--red)}

        /* ?check — самоперевірка після правок seasons.json (бачить лише той, хто відкрив з ?check) */
        .chk{border:2px dashed var(--red);border-radius:10px;padding:16px 20px 6px;margin:0 0 50px;font-size:14px;line-height:1.55;overflow-wrap:anywhere}
        .chk-h{font-size:11px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;color:var(--red);margin:4px 0 8px}
        .chk ul{margin:0 0 14px;padding-left:20px}
        .chk p{margin:0 0 12px;color:var(--mut)}

        .modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:1000;align-items:center;justify-content:center}
        .modal.show{display:flex}
        .mod-in{width:100%;max-width:1000px;padding:20px;position:relative;transition:transform .2s ease-out;max-height:94vh;overflow-y:auto;-webkit-overflow-scrolling:touch}
        .iframe-wrap{position:relative;padding-bottom:56.25%;height:0;overflow:hidden;border-radius:8px;background:#000}
        .iframe-wrap iframe,.iframe-wrap video{position:absolute;top:0;left:0;width:100%;height:100%;border:0;background:#000}
        .iframe-wrap video{display:none}
        .close{position:absolute;top:-15px;right:20px;color:#fff;font:inherit;font-size:40px;line-height:1;cursor:pointer;z-index:10;background:none;border:0;padding:0 6px}
        .close:hover{color:var(--red)}
        .footer{text-align:center;padding:60px 0;font-size:11px;color:var(--mut);letter-spacing:2px}
        /* Пошта під кнопками — ледь помітна: хто шукає, той побачить */
        .mail{margin-top:12px}
        .mail a{font-size:11px;letter-spacing:.5px;color:var(--mut);opacity:.45;text-decoration:none;transition:.25s}
        .mail a:hover{opacity:1;color:var(--red)}
        @media(max-width:1024px){
            .eps,.season.done .eps{grid-template-columns:repeat(2,1fr)}
            .season.live .s-title{font-size:56px;letter-spacing:-2px}
            .grid{grid-template-columns:repeat(4,1fr)}
        }
        @media(max-width:600px){
            body{padding:15px 15px 0}
            .intro{margin:5px 0 35px}
            .eps{grid-template-columns:1fr}
            .s-title{font-size:34px}
