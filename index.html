    }

    // ── Підтримка: тихі посилання в шапці ─────────────────────────────────────────
    const offTag = why => why ? ` <span class="off-tag">${esc(why.startsWith('вимкнено') ? 'вимкнено' : why)}</span>` : '';
    // Збір: «● Збір: Назва ↗» одразу на банку, під назвою — тонка шкала зібраного (коли є ціль).
    // «навіщо» і суми — підказкою при наведенні. Після until зникає сам.
    // id="f-…" — якір для посилань із бота (taras.kyiv.ua/#f-dron підсвічує збір).
    function fundLinksHtml(today) {
        let hash = safeDecode(location.hash);
        return SUPPORT.funds.filter(f => !fundWhy(f, today) || (CHECK && f.title)).map(f => {
            // :target не спрацьовує на посиланні, яке зʼявилось уже після завантаження, — підсвічуємо за адресою самі
            let hl = hash === '#f-' + f.id ? ' hl' : '';
            let n = fundNow(f), pct = n.goal ? Math.floor(n.raised / n.goal * 100) : 0;
            if (n.goal && n.raised > 0 && pct < 1) pct = 1;
            let sums = n.goal ? `${fmtMoney(n.raised)} з ${fmtMoney(n.goal)} (${pct}%)` : '';
            let tip = [f.about, sums].filter(Boolean).join('\n');
            let why = fundWhy(f, today), attrs = ` class="q-link fund-link${why ? ' off' : ''}${hl}" id="f-${esc(f.id)}"` + (tip ? ` title="${esc(tip)}"` : '');
            let bar = n.goal ? `<span class="fund-bar" aria-hidden="true"><i style="width:${Math.min(pct, 100)}%"></i></span><span class="sr-only"> — зібрано ${pct}%</span>` : '';
            let body = `<span class="fund-body"><span>Збір: ${esc(f.title)} ↗${offTag(why)}</span>${bar}</span>`;
            return f.url && !isSample(f.url) ? `<a${attrs} href="${esc(f.url)}" target="_blank" rel="noopener">${body}</a>` : `<span${attrs}>${body}</span>`;
        }).join('');
    }
    // «Підтримати ↗» (Mono Base чи банка) — тим самим тихим посиланням; глядач бачить лише увімкнене, ?check — усе з адресою
    function donateHtml() {
        let l = SUPPORT.donate, why = linkWhy(l);
        if (why && !(CHECK && l && l.url)) return '';
        return `<a class="q-link${why ? ' off' : ''}" href="${esc(l.url)}" target="_blank" rel="noopener"` +
            (l.about ? ` title="${esc(l.about)}"` : '') + `>${esc(l.label)} ↗${offTag(why)}</a>`;
    }
    // Свіжі суми для шкали — fundraisers.json (оновлює GitHub Action): лише коли на сторінці є збір із банкою monobank.
    // Доки файл не прийшов (чи його нема) — шкала за raised із seasons.json (бот записує туди знімок суми).
    let FUNDS_ASKED = false;
    function loadFunds(today) {
        if (FUNDS_ASKED || !SUPPORT.funds.some(f => f.jar && !isSample(f.url) && (CHECK || !fundWhy(f, today)))) return;
        FUNDS_ASKED = true;
        getFile('fundraisers.json').then(r => r.ok ? r.json() : null).then(d => {
            if (isObj(d) && isObj(d.jars)) { FUNDS_LIVE = d; LAST_HTML = ''; render(); }
        }).catch(() => {});
    }

    function ytHref(rec) { return rec.y ? 'https://www.youtube.com/watch?v=' + encodeURIComponent(rec.y) : '#'; }
    function imgTag(rec, cls, sizes) {
        if (!rec.thumb) return '';
        let load = EAGER-- > 0 ? (FIRST_IMG ? ' fetchpriority="high"' : '') : ' loading="lazy"';
        if (load) FIRST_IMG = false;
        return `<img src="${esc(rec.thumb)}"` + (rec.srcset ? ` srcset="${esc(rec.srcset)}" sizes="${sizes}"` : '') +
            (cls ? ` class="${cls}"` : '') + load + ' decoding="async" alt="">';
    }
    function epCount(n, total) {
        return total ? `Серій: ${n} / ${total}` : (n ? `${n} ${plural(n, 'серія', 'серії', 'серій')}` : '');
    }

    function seasonHtml(s, st, today) {
        let eps = (EPS[s.k] || []).slice().sort((a, b) => a.ts < b.ts ? -1 : a.ts > b.ts ? 1 : 0);
        let daily = s.format === 'daily';
        let stLbl = st === 'live' ? '<span class="s-live">Зараз</span>' : (st === 'soon' ? 'Скоро' : 'Завершено');
        let html = `<section class="season ${st} ${s.format}" id="${s.id}">` +
            `<div class="s-lbl">${s.title ? 'Сезон ' + s.n + (st === 'live' ? ' ' : ' · ') : ''}${stLbl}</div>` +
            `<h2 class="s-title">${esc(s.title || 'Сезон ' + s.n)}</h2>` +
            (s.about ? `<p class="s-about">${esc(s.about)}</p>` : '');

        let meta = [st === 'soon' ? 'Старт — ' + fmtDay(s.start, true) : esc(fmtRange(s))].filter(Boolean);
        if (st !== 'done' && s.schedule) meta.push(esc(s.schedule));
        if (s.playlist && st !== 'soon')
            meta.push(`<a href="https://www.youtube.com/playlist?list=${encodeURIComponent(s.playlist)}" target="_blank" rel="noopener">Плейлист на YouTube ↗</a>`);
        if (st !== 'done')
            meta.push(`<a href="${CHANNEL_URL}?sub_confirmation=1" target="_blank" rel="noopener">Підписатися ↗</a>`);
        if (s.support && st !== 'done')
            meta.push(`<a class="hot" href="${esc(s.support)}" target="_blank" rel="noopener">Підтримати сезон ↗</a>`);
        html += `<div class="s-meta">${meta.map(m => `<span>${m}</span>`).join('')}</div>`;

        if (st === 'soon') return html + '</section>';

        // Прогрес сезону — за часом (тижні / дні), тож він «живий» навіть до першої серії.
        if (st === 'live') {
            let left = '', bar = '';
            let cnt = LOADING && !eps.length ? '' : (daily ? (eps.length ? eps.length + ' відео' : '') : epCount(eps.length, s.episodes));
            if (s.start) {
                let passed = dayNum(today) - dayNum(s.start);
                if (s.end) {
                    let total = dayNum(s.end) - dayNum(s.start);
                    let pct = Math.max(2, Math.min(100, Math.round(passed / Math.max(1, total) * 100)));
                    if (daily) left = `День ${passed + 1} з ${total + 1}`;
                    else {
                        let weeks = Math.max(1, Math.round(total / 7));
                        left = `Тиждень ${Math.min(weeks, Math.floor(passed / 7) + 1)} з ${weeks}`;
                    }
                    bar = `<div class="prog-bar"><i style="width:${pct}%"></i></div>`;
                } else left = daily ? `День ${passed + 1}` : `Тиждень ${Math.floor(passed / 7) + 1}`;
            }
            if (left || cnt) html += `<div class="prog">${bar}<div class="prog-txt"><span>${left}</span><span>${cnt}</span></div></div>`;
        }

        if (LOAD_FAILED && !eps.length)
            return html + '<p class="s-msg">Не вдалось завантажити серії. Спробуйте оновити сторінку.</p></section>';
        if (LOADING && !eps.length && s.playlist)       // перший візит: YouTube ще думає
            return html + (daily ? '<div class="grid">' + '<div class="cell"></div>'.repeat(7) + '</div>'
                : '<div class="eps">' + '<div class="ep"><div class="ep-th sk"></div><div class="sk sk-l"></div><div class="sk sk-l"></div></div>'.repeat(3) + '</div>') + '</section>';

        return html + (daily ? dailyHtml(s, st, today, eps) : weeklyHtml(s, st, today, eps)) + '</section>';
    }

    // Головна: теми (коли вже є хештеги) → панель вибраної теми → стіна днів
    function homeHtml(today) {
        return (CAL_HIDDEN ? '<p class="cal-hidden">Сховано: глядачі цієї стіни не бачать (seasons.json → calendar.enabled: false). Це попередній перегляд; повернути — "enabled": true.</p>' : '') +
            homeInner(today);
    }
    function homeInner(today) {
        let s = CAL, soon = '<div class="s-lbl">Стіна днів</div><p class="cal-soon">Скоро тут зʼявиться перша стрічка.</p>';
        if (s.start && today < s.start)                // ще до першого дня — спокійна заглушка (без відліку й дедлайну)
            return `<section class="cal-home" id="cal">${soon}</section>`;
        let eps = (EPS.cal || []).slice().sort((a, b) => a.ts < b.ts ? -1 : a.ts > b.ts ? 1 : 0);
        let all = allRecs();
        let html = topicsBar(all) + topicPanel(all, today) +
            `<section class="cal-home${TOPIC ? ' filtering' : ''}" id="cal" aria-label="Стіна днів"><h2 class="sr-only">Стіна днів</h2>`;
        if (LOAD_FAILED && !eps.length) return html + '<p class="s-msg">Не вдалось завантажити відео. Спробуйте оновити сторінку.</p></section>';
        if (LOADING && !eps.length) return html + '<div class="sk sk-m"></div><div class="grid">' + '<div class="cell"></div>'.repeat(7) + '</div></section>';
        // Над стіною: 🎲 випадковий день (коли є з чого вибирати) і на телефоні «Сьогодні ↓» — місяць у дві колонки
        // займає кілька екранів (адресу й вибрану тему кнопка не чіпає)
        let n = eps.filter(playable).length;
        let acts = (n > 1 ? '<button type="button" class="act" onclick="randomDay()">🎲 Випадковий день</button>' : '') +
            (n ? `<button type="button" class="act" onclick="myDayToggle(this)" aria-expanded="${MD_OPEN}" aria-controls="myday">🎂 Мій день</button>` : '') +
            (+today.slice(8) > 6 ? `<a class="act to-today" href="#cal-${today}" onclick="event.preventDefault();showDay('${today}')">Сьогодні ↓</a>` : '');
        // Відлік стіни — від дня першого відео (calendar.start лише відсікає старіші проби): без порожніх тижнів до старту
        let wall = eps.length ? dailyHtml(Object.assign({}, s, { start: eps[0].date }), 'live', today, eps) : '';
        let since = sinceInner();
        if (since) html = html.replace('<section class="cal-home', `<div class="since" id="since">${since}</div><section class="cal-home`);
        return html + (wall && acts ? `<div class="cal-acts">${acts}</div>${mydayHtml()}` : '') + (wall || soon) + '</section>';
    }

    // ── 🎞 Фільми ───────────────────────────────────────────────────────────────
    // Кожне відео — фільм із горизонтальною афішею: превʼю відео цілком + смуга з № у каталозі, датою, назвою й «титрами».
    // Каталог за датою виходу: роки від найновішого, у році — найновіші першими.
    // № — порядковий номер від першого фільму (як у каталозі): з новими фільмами старі номери не змінюються.
    // Ні прем'єр, ні відліків, ні нагадувань — лише афіші того, що вже вийшло.
    // Апостроф на афіші — ’: у вузькому шрифті ʼ (U+02BC) і ' — широкий прямий штрих із дірою після нього
    const FILM_OF = 'Фільм Тараса Максим’яка', curly = t => t.replace(/[ʼ']/g, '’');
    function fmtDur(sec) {
        if (!(sec > 0)) return '';
        let m = Math.max(1, Math.round(sec / 60));
        return m < 60 ? m + ' хв' : Math.floor(m / 60) + ' год' + (m % 60 ? ' ' + pad2(m % 60) + ' хв' : '');
    }
    const filmsSorted = () => (EPS.films || []).slice().sort(byTs);
    function filmNo(key) { return filmsSorted().findIndex(r => r.key === key) + 1; }
    // Розмір назви — щоб найдовше слово влізло в рядок, а вся назва — у 2–3 рядки (вузький шрифт: літера ≈ 0,56 кегля)
    function titleSize(t) {
        let words = t.split(/\s+/), w = Math.max(...words.map(x => [...x].length)), n = [...t].length;
        return Math.max(4.4, Math.min(7.6, 90 / (.56 * w), 330 / n)).toFixed(1);
    }
    function posterHtml(rec, no, isNew) {
        let idx = playIdx(rec, 'films'), dur = fmtDur((metaById[rec.key] || {}).dur);
        let title = showTitle(rec.title) || 'Без назви', [y, m, d] = rec.date.split('-').map(Number), date = `${d} ${MONTHS_GEN[m - 1]} ${y}`;
        let src = rec.pst || rec.thumb, img = '';       // pst — найбільше превʼю (maxres 1280×720); thumb — запасне
        if (src) {
            let load = EAGER-- > 0 ? (FIRST_IMG ? ' fetchpriority="high"' : '') : ' loading="lazy"';
            if (load) FIRST_IMG = false;
            img = `<img class="pst-img" src="${esc(src)}"${load} decoding="async" alt="">`;
        }
        let hit = TOPIC && recTopics(rec).includes(TOPIC) ? ' hit' : '', seen = watched.includes(rec.key) ? ' watched' : '';
        return `<div class="film${hit}" data-date="${rec.date}">` +
            `<a class="poster${seen}" href="${ytHref(rec)}" target="_blank" rel="noopener" data-k="${esc(rec.key)}" onclick="openVid(event, ${idx}, this)" aria-label="${esc(title)} — № ${no}, ${date}${dur ? ', ' + dur : ''}">` +
            `<span class="pst-frame">${img}` + (isNew ? '<span class="pst-new">Новий</span>' : '') + '<span class="pst-play"></span><span class="pst-seen">Переглянуто</span></span>' +
            `<span class="pst-band"><span class="pst-top"><span class="pst-no">№ ${pad2(no)}</span><span>${date}</span></span>` +
            `<span class="pst-t" style="font-size:${titleSize(title)}cqw">${esc(curly(title))}</span>` +
            `<span class="pst-bill">${FILM_OF}${dur ? ' · ' + dur : ''}</span></span></a>` +
            (OPEN_IN_APP ? `<button type="button" class="v-more" onclick="daySheet(${idx}, this)" aria-label="Про фільм: ${esc(title)}"><span></span></button>` : '') +
            '</div>';
    }
    function filmsHtml(today) {
        let all = filmsSorted(), list = TOPIC ? all.filter(r => recTopics(r).includes(TOPIC)) : all;
        let html = (FILMS_HIDDEN ? '<p class="cal-hidden">Сховано: глядачі фільмів не бачать (seasons.json → films.enabled: false). Це попередній перегляд; повернути — "enabled": true.</p>' : '') +
            `<section class="films${TOPIC ? ' filtering' : ''}" id="films" aria-label="Фільми"><h2 class="sr-only">Фільми</h2>`;
        if (LOAD_FAILED && !all.length) return html + '<p class="s-msg">Не вдалось завантажити фільми. Спробуйте оновити сторінку.</p></section>';
        if (LOADING && !all.length) return html + '<div class="fl-grid">' + '<div class="film"><div class="poster sk"></div></div>'.repeat(3) + '</div></section>';
        if (!all.length) return html + '<div class="fl-grid"><div class="film"><div class="poster soon"><span class="pst-frame"><span class="soon-t">Скоро</span></span>' +
            `<span class="pst-band"><span class="pst-top"><span class="pst-no">№ 01</span></span><span class="pst-t" style="font-size:7.6cqw">Перший фільм</span><span class="pst-bill">${FILM_OF}</span></span></div></div>` +
            `<p class="fl-soon">Тут виходитимуть фільми — кожен зі своєю афішею. А поки всі відео — на <a href="${CHANNEL_URL}" target="_blank" rel="noopener">YouTube ↗</a></p></div></section>`;
        html += topicsBar(allRecs());
        if (TOPIC) {
            let cfg = TOPICS.cfg[TOPIC] || {};
            html += `<p class="fl-topic">${esc(topicLabel(TOPIC))} — ${list.length} ${plural(list.length, 'фільм', 'фільми', 'фільмів')}` +
                (cfg.about ? '. ' + esc(cfg.about) : '') + '<a href="#">× Усі фільми</a></p>';
        }
        let no = new Map(all.map((r, i) => [r.key, i + 1])), last = all[all.length - 1];
        let fresh = last && !watched.includes(last.key) && dayNum(today) - dayNum(last.date) < 14 ? last.key : '';
        let years = {};
        list.forEach(r => (years[r.date.slice(0, 4)] = years[r.date.slice(0, 4)] || []).push(r));
        html += '<div id="fl-body">' + Object.keys(years).sort().reverse().map(y => {
            let l = years[y].reverse();
            return `<h3 class="fl-year" id="films-${y}">${y}<span class="fl-yc">${l.length} ${plural(l.length, 'фільм', 'фільми', 'фільмів')}</span></h3>` +
                '<div class="fl-grid">' + l.map(r => posterHtml(r, no.get(r.key), r.key === fresh)).join('') + '</div>';
        }).join('') + '</div>';
        let since = sinceInner();
        if (since) html = html.replace('<div id="fl-body">', `<div class="since" id="since">${since}</div><div id="fl-body">`);
        return html + '</section>';
    }

    // Усі відомі відео (календар + сезони) без дублів — для каталогу тем
    function allRecs() {
        let seen = new Set(), out = [];
        [EPS.films || [], EPS.cal || [], ...SEASONS.map(s => EPS[s.k] || [])].forEach(l => l.forEach(r => { if (!seen.has(r.key)) { seen.add(r.key); out.push(r); } }));
        return out;
    }
    function topicCounts(all) {                        // [[тема, {n, last}]] — найчастіші першими, далі найсвіжіші
        let m = {};
        all.forEach(r => recTopics(r).forEach(t => { let e = m[t] = m[t] || { n: 0, last: '' }; e.n++; if (r.ts > e.last) e.last = r.ts; }));
        return Object.entries(m).sort((a, b) => b[1].n - a[1].n || (a[1].last < b[1].last ? 1 : -1));
    }
    // Каталог тем — ряд «чипів» над календарем; вибрана тема — у адресі (#t=…), тож нею можна поділитися
    const chipLabel = t => `<span class="chip-l" title="${esc(topicLabel(t))}">${esc(topicLabel(t))}</span>`;
    function topicsBar(all) {
        let list = topicCounts(all);
        if (!list.length) return '';
        // На компʼютері — 12 найчастіших тем, решта під «ще N» (щоб теми не відсували календар; вибрана — завжди видно)
        const MAX = 12, extra = list.length - MAX;
        return '<nav class="topics" aria-label="Теми"><span class="topics-lbl">Теми</span>' + list.map(([t, e], i) => {
            let on = t === TOPIC;
            return `<a class="chip${on ? ' on' : ''}${i >= MAX && !on ? ' extra' : ''}" href="${on ? '#' : '#t=' + encodeURIComponent(t)}"${on ? ' aria-current="true"' : ''}>${chipLabel(t)}<span>${e.n}</span></a>`;
        }).join('') + (extra > 0 ? `<button type="button" class="chip more" onclick="this.parentNode.classList.add('all')">ще ${extra}</button>` : '') + '</nav>';
    }
    // Вибрана тема: усі її відео (найновіші першими) + календар нижче приглушує інші
    function topicPanel(all, today) {
        if (!TOPIC) return '';
        let list = all.filter(r => recTopics(r).includes(TOPIC)).sort((a, b) => a.ts < b.ts ? 1 : -1);
        let cfg = TOPICS.cfg[TOPIC] || {};
        let html = `<section class="topic" id="topic"><div class="s-lbl">Тема${list.length ? ' · ' + list.length + ' відео' : ''}</div>` +
            `<h2 class="s-title">${esc(topicLabel(TOPIC))}</h2>` + (cfg.about ? `<p class="s-about">${esc(cfg.about)}</p>` : '');
        let meta = list.length ? [esc(fmtRange({ start: list[list.length - 1].date, end: list[0].date }))] : [];
        meta.push('<a href="#">× Усі дні</a>');
        html += `<div class="s-meta">${meta.map(m => `<span>${m}</span>`).join('')}</div>`;
        if (!list.length) return html + '<p class="s-msg">Поки що нема відео з цією темою.</p></section>';
        let sizes = '(max-width:600px) 30vw, (max-width:1024px) 50vw, 340px';
        return html + '<div class="eps compact">' + list.map(rec => {
            let idx = playIdx(rec, 'topic');
            return `<a href="${ytHref(rec)}" class="ep${watched.includes(rec.key) ? ' watched' : ''}" data-k="${esc(rec.key)}" onclick="openVid(event, ${idx}, this)">` +
                `<div class="ep-th">${imgTag(rec, '', sizes)}${rec.imp ? STAR_SVG : ''}</div>` +
                `<div class="ep-k">${fmtDay(rec.date, rec.date.slice(0, 4) !== today.slice(0, 4))}</div>` +
                `<div class="ep-t">${esc(showTitle(rec.title))}</div></a>`;
        }).join('') + '</div></section>';
    }

    // Щотижневий формат: картки серій 01, 02, … + пунктирне місце наступної
    function weeklyHtml(s, st, today, eps) {
        let showNote = st === 'live';
        // Якість: мініатюра не менша за ~90% ширини картки в пікселях екрана (перевірено заміром різкості).
        // Велика картка на телефоні 3x бере 1280, на 2x — 640; на ноутбуці 640, бо 480 від YouTube помітно мʼякший.
        // Маленькі картки завершених сезонів і так отримують ≥ 1:1, тож беруть легші 320/480.
        let sizes = st === 'done' ? '(max-width:600px) 30vw, (max-width:1024px) 50vw, 340px'
            : '(max-width:600px) calc((100vw - 30px) * .9), (max-width:1024px) calc((100vw - 62px) / 2), 560px';
        let html = '<div class="eps">';
        eps.forEach((rec, i) => {
            let idx = playIdx(rec, s.k);
            let body = (metaById[rec.key] || {}).body || '';
            let isNew = st === 'live' && i === eps.length - 1 && dayNum(today) - dayNum(rec.date) < 7;
            // Справжнє посилання на YouTube: Ctrl/Cmd-клік і середня кнопка відкривають відео в новій вкладці
            html += `<a href="${ytHref(rec)}" class="ep${watched.includes(rec.key) ? ' watched' : ''}" data-k="${esc(rec.key)}" onclick="openVid(event, ${idx}, this)">` +
                `<div class="ep-th">${imgTag(rec, '', sizes)}` +
                (isNew ? '<span class="ep-new">Нова</span>' : '') + (rec.imp ? STAR_SVG : '') + `</div>` +
                `<div class="ep-k">Серія ${pad2(i + 1)} · ${fmtDay(rec.date, rec.date.slice(0, 4) !== today.slice(0, 4))}</div>` +
                `<div class="ep-t">${esc(showTitle(rec.title))}</div>` +
                (showNote && body ? `<div class="ep-x">${esc(body.slice(0, 240))}</div>` : '') + `</a>`;
        });
        if (st === 'live' && (!s.episodes || eps.length < s.episodes)) {
            let n = eps.length + 1;
            html += `<div class="ep next"><div class="ep-th"><span>${pad2(n)}</span></div>` +
                `<div class="ep-k">Серія ${pad2(n)} · скоро</div>` +
                `<div class="ep-t">${eps.length ? 'Наступна серія' : 'Перша серія'}</div></div>`;
        }
        return html + '</div>';
    }

    // Щоденний формат: «стіна днів» по місяцях. Прожиті дні — клітинки (без відео — лише дата),
    // сьогодні без відео — пунктир «сьогодні», майбутнє не малюємо. Останні 2 місяці відкриті,
    // давніші — згорнуті в «Раніше» (довгий сезон не перетворює сторінку на нескінченну стрічку).
    function dailyHtml(s, st, today, eps) {
        let byDay = {};
        eps.forEach(rec => { (byDay[rec.date] = byDay[rec.date] || []).push(rec); });
        let first = s.start || (eps[0] && eps[0].date);
        if (!first) return '';
        let last = st === 'live' ? today : (s.end || (eps.length ? eps[eps.length - 1].date : today));
        if (s.end && last > s.end) last = s.end;
        if (last < first) return '';

        let months = [];
        for (let n = dayNum(first), end = dayNum(last); n <= end; n++) {
            let d = fromDayNum(n), ym = d.slice(0, 7);
            if (!months.length || months[months.length - 1].ym !== ym) months.push({ ym, days: [] });
            months[months.length - 1].days.push(d);
        }
        let sizes = '(max-width:600px) 30vw, (max-width:1024px) 25vw, 200px';
        let monthHtml = mo => {
            let [y, m] = mo.ym.split('-').map(Number);
            let h = `<div class="cal-mo" id="${s.id}-${mo.ym}"><h3 class="cal-hdr">${MONTHS[m - 1]}${String(y) !== today.slice(0, 4) ? ' ' + y : ''}</h3><div class="grid">`;
            mo.days.forEach((d, i) => {
                let w = new Date(dayNum(d) * DAY_MS).getUTCDay(), recs = byDay[d] || [], dn = +d.slice(8);
                if (w === 1 && i > 0) h += '<div class="week-divider"></div>';
                let dt = `<div class="dt"><span class="dt-n">${dn}</span><span class="dt-d">${WDAYS[w]}</span></div>`;
                let isToday = d === today && st === 'live', tid = ` id="${s.id}-${d}"`;   // id дня — для «Сьогодні ↓», випадкового дня й посилань #d=
                if (!recs.length) { h += `<div class="cell ${isToday ? 'today' : 'empty'}"${tid}>${dt}</div>`; return; }
                let idxs = recs.map(rec => playIdx(rec, s.k));
                let links = recs.map((rec, j) => {
                    let idx = idxs[j];
                    let body = (metaById[rec.key] || {}).body || '';
                    let hit = TOPIC && recTopics(rec).includes(TOPIC) ? ' hit' : '';
                    return `<a href="${ytHref(rec)}" class="v-lnk${watched.includes(rec.key) ? ' watched' : ''}${hit}" data-k="${esc(rec.key)}" onclick="openVid(event, ${idx}, this)">` +
                        imgTag(rec, 'v-thumb', sizes) + (body ? `<div class="v-excerpt">${esc(body.slice(0, 160))}</div>` : '') +
                        `<div class="v-title">${esc(showTitle(rec.title))}</div></a>`;
                }).join('');
                // Телефон: дотик по кадру — одразу застосунок YouTube; «⋯» — аркуш дня (записка, картка, гортання)
                let more = OPEN_IN_APP ? `<button type="button" class="v-more" onclick="daySheet(${idxs[0]}, this)" aria-label="Про день: ${dn} ${MONTHS_GEN[+d.slice(5, 7) - 1]}"><span></span></button>` : '';
                h += `<div class="cell has-vid${more ? ' has-more' : ''}"${tid}><div class="v-cont${recs.length > 1 ? ' mult' : ''}">${links}</div>${dt}${recs.some(r => r.imp) ? STAR_SVG : ''}${more}</div>`;
            });
            return h + '</div></div>';
        };
        let open = st === 'live' ? months.slice(-2) : [];
        let folded = st === 'live' ? months.slice(0, -2) : months;
        let openHtml = open.map(monthHtml).join('');
        EAGER = 0;                                     // мініатюри згорнутих місяців одразу не вантажимо
        let html = '';
        if (folded.length) {
            let cnt = folded.reduce((a, mo) => a + mo.days.reduce((b, d) => b + (byDay[d] || []).length, 0), 0);
            let label = st === 'live'
                ? `Раніше · ${folded.length} ${plural(folded.length, 'місяць', 'місяці', 'місяців')}`
                : `Календар сезону · ${months.length} ${plural(months.length, 'місяць', 'місяці', 'місяців')}`;
            html += `<details class="cal-old" id="${s.id}-old"><summary>${label} · ${cnt} відео</summary>${folded.map(monthHtml).join('')}</details>`;
        }
        return html + openHtml;
    }

    // Самоперевірка: taras.kyiv.ua/?check — що сайт зрозумів із seasons.json і чому якихось серій не видно.
    function checkHtml(today) {
        const stName = { live: 'йде зараз', soon: 'ще не почався', done: 'завершено' };
        let rows = '';
        if (FILMS) {
            let n = (EPS.films || []).length, h = HIDDEN[FILMS.playlist] || 0, durs = (EPS.films || []).filter(r => (metaById[r.key] || {}).dur > 0).length;
            rows += `<li><b>Фільми</b>${FILMS_HIDDEN ? ' — <b>сховано від глядачів</b> (films.enabled: false), нижче попередній перегляд;' : ' —'} джерело ${esc(FILMS.playlist || '—')}: ` +
                `на сайті ${n} ${plural(n, 'фільм', 'фільми', 'фільмів')}` + (h ? `, ще ${h} приховано (приватні / заплановані)` : '') +
                (n ? `, тривалість відома для ${durs}` : '') + (FILMS.exclude.length ? `; без відео з ${esc(FILMS.exclude.join(', '))}` : '') +
                (FILMS.start ? `; старіші за ${fmtDay(FILMS.start, true)} не беремо` : '') + (FILMS_NOTE ? ` — ${esc(FILMS_NOTE)}` : '') + '</li>';
        }
        if (FILMS || CAL) {
            let tl = topicCounts(allRecs());
            rows += `<li><b>Теми</b> — ${tl.length ? tl.map(([t, e]) => esc(topicLabel(t)) + ' (' + e.n + ')').join(', ') : 'поки жодного хештегу в назвах чи описах відео'}</li>`;
        }
        if (CAL) {
            let n = (EPS.cal || []).length, h = HIDDEN[CAL.playlist] || 0;
            let first = (EPS.cal || []).reduce((m, r) => !m || r.date < m ? r.date : m, '');
            rows += `<li><b>Календар</b>${CAL_HIDDEN ? ' — <b>сховано від глядачів</b> (calendar.enabled: false), нижче попередній перегляд;' : ' —'} відлік від першого відео${first ? ' (' + fmtDay(first, true) + ')' : ' (його ще нема)'}` +
                (CAL.start ? `, старіші за ${fmtDay(CAL.start, true)} не беремо` : '') + `; джерело ${esc(CAL.playlist || '—')}: ` +
                `на сайті ${n} відео` + (h ? `, ще ${h} приховано (приватні / заплановані)` : '') +
                (CAL.exclude.length ? `; без відео з ${esc(CAL.exclude.join(', '))}` : '') + (CAL_NOTE ? ` — ${esc(CAL_NOTE)}` : '') +
                (CAL.start && today < CAL.start ? ` — ще не почався: до ${esc(fmtDay(CAL.start, true))} головна показує «Скоро тут зʼявиться перша стрічка»` : '') + '</li>';
        }
        rows += SEASONS.map(s => {
            let n = (EPS[s.k] || []).length, h = HIDDEN[s.playlist] || 0;
            return `<li><b>Сезон ${s.n}</b> ${s.title ? '«' + esc(s.title) + '»' : '(без назви)'} — ${s.format === 'daily' ? 'щоденний' : 'щотижневий'}, ` +
                `${stName[seasonState(s, today)]}, ${esc(fmtRange(s) || 'без дат')}; ` + (s.playlist
                    ? `плейлист ${esc(s.playlist)}: на сайті ${n} ${plural(n, 'серія', 'серії', 'серій')}` +
                      (h ? `, ще ${h} приховано (приватні / заплановані / видалені)` : '')
                    : 'нема плейлиста') + `</li>`;
        }).join('');
        rows += supCheckRows(today);
        return `<div class="chk"><div class="chk-h">Перевірка сайту</div>` +
            `<p>Режим: ${esc(MODE)} · сезони: ${esc(SRC.seasons || '—')} · серії: ${esc(SRC.eps || '—')}</p>` +
            (rows ? `<ul>${rows}</ul>` : '') + `<div class="chk-h">Що виправити</div>` +
            (ISSUES.length ? `<ul>${ISSUES.map(m => `<li>${esc(m)}</li>`).join('')}</ul>` : '<p>✓ Помилок не знайдено.</p>') + `</div>`;
    }

    function supCheckRows(today) {
        let S = SUPPORT, rows = '', link = (name, l) => {
            let why = linkWhy(l);
            return `<li><b>${name}</b> — ${why ? esc(why) : '✓ на сайті'}${l && l.url ? ': ' + esc(l.url) : ''}</li>`;
        };
        if (!S.donate && !S.funds.length) return '';
        rows += `<li><b>Підтримка</b> — ${S.enabled ? 'увімкнено (support.enabled)' : 'вимкнено: глядачі не бачать нічого з цього; тут — попередній перегляд з позначкою «вимкнено»'}</li>`;
        if (S.donate) rows += link('Підтримати', S.donate);
        S.funds.forEach(f => {
            let why = fundWhy(f, today), n = fundNow(f);
            let src = n.live ? `з банки (fundraisers.json, ${esc(FUNDS_LIVE.updated || 'час невідомий')})`
                : f.jar && !isSample(f.url) ? 'з seasons.json (raised) — живі суми з банки підтягує GitHub Action раз на годину' : 'з seasons.json (raised)';
            rows += `<li><b>Збір</b> «${esc(f.title || '—')}» (#f-${esc(f.id)}) — ${why ? esc(why) : '✓ на сайті'}; ` +
                `зібрано ${fmtMoney(n.raised)}${n.goal ? ' з ' + fmtMoney(n.goal) : ', без цілі'} — ${src}</li>`;
        });
        return rows;
    }

    // ── Плеєр ──────────────────────────────────────────────────────────────────
    // Телефон/планшет (iOS, iPadOS, Android): відео YouTube відкриваємо в застосунку YouTube
    // (нема застосунку — відкриється сайт YouTube). Компʼютер — вікно з плеєром і запискою на сайті.
    const UA = navigator.userAgent || '';
    const IS_ANDROID = /Android/i.test(UA);
    const IS_IOS = /iPhone|iPad|iPod/i.test(UA) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    const OPEN_IN_APP = IS_ANDROID || IS_IOS;
    window.openApp = window.openApp || (u => { location.href = u; });   // окремо — щоб перехід можна було перевірити тестом

    // Переглянуте: відмітка живе в localStorage цього браузера (ключ vw, спільний із calendar.html) і лишається
    // між візитами. Відмічаємо всі копії відео на сторінці (календар, тема, сезон) одразу.
    let askedPersist = false;
    function markWatched(key) {
        if (!key) return;
        if (!watched.includes(key)) { watched.push(key); lsSet('vw', JSON.stringify(watched)); }
        document.querySelectorAll('[data-k]').forEach(el => { if (el.dataset.k === key) el.classList.add('watched'); });
        updateSince();
        // Просимо браузер не стирати сховище під час нестачі місця (Chrome/Safari вирішують тихо; Firefox питав би — не чіпаємо)
        if (!askedPersist && !/Firefox/i.test(UA)) {
            askedPersist = true;
            try { navigator.storage.persisted().then(p => p || navigator.storage.persist()).catch(() => {}); } catch(e) {}
        }
    }
    // Відмітили в іншій вкладці — оновлюємо й тут
    window.addEventListener('storage', e => {
        if (e.key !== 'vw') return;
        watched = lsJSON('vw', []); if (!Array.isArray(watched)) watched = [];
        LAST_HTML = ''; render();
    });

    // Прогрів: при першому наведенні/дотику на відео заздалегідь відкриваємо з'єднання з YouTube — плеєр стартує швидше
    let warmed = OPEN_IN_APP;                         // на телефоні плеєр на сайті не відкривається — гріти нічого
    function warm(e) {
        if (warmed || !e.target.closest || !e.target.closest('.ep,.v-lnk,.poster')) return;
        warmed = true;
        let l = document.createElement('link'); l.rel = 'preconnect'; l.href = 'https://www.youtube.com';
        document.head.appendChild(l);
    }
    document.addEventListener('pointerover', warm, { passive: true });
    document.addEventListener('focusin', warm);

    // ── Плеєр ───────────────────────────────────────────────────────────────────
    // Компʼютер: вікно з відео, датою, запискою; ‹ › (і стрілки ← →, свайп) гортають дні — як сторінки щоденника.
    // Телефон: дотик по дню — застосунок YouTube; «⋯» на дні відкриває «аркуш дня» без плеєра: кадр, записка,
    // картка для Stories, посилання, гортання; «▶ Дивитися в YouTube» — у застосунок.
    // Контекст гортання — звідки відкрили: стіна днів, вибрана тема, сезон або «з твого візиту» (черга нових днів).
    const toP = (rec, ctx) => ({ key: rec.key, y: rec.y || '', v: rec.v || '', tags: rec.tags || [], date: rec.date, title: rec.title, thumb: rec.pst || rec.thumb || '', ctx });
    function playIdx(rec, ctx) { return PLAY.push(toP(rec, ctx)) - 1; }
    const byTs = (a, b) => a.ts < b.ts ? -1 : a.ts > b.ts ? 1 : 0;
    const playable = r => !!(r && (r.y || r.v));
    const isAppVideo = p => OPEN_IN_APP && !!p.y && !(BASE && p.v);     // телефон + відео з YouTube → застосунок
    const ytWatch = p => 'https://www.youtube.com/watch?v=' + encodeURIComponent(p.y);
    const $ = id => document.getElementById(id);
    const isFilm = p => p.ctx === 'films' || (p.ctx === 'queue' && !!FILMS);
    let lastFocus = null, CUR = null, QUEUE = [], QUEUE_ON = false;

    function navList(ctx) {
        if (ctx === 'queue') return QUEUE;
        let list = ctx === 'topic' || (ctx === 'films' && TOPIC) ? (ctx === 'films' ? EPS.films || [] : allRecs()).filter(r => recTopics(r).includes(TOPIC)) : (EPS[ctx] || []);
        return list.filter(playable).slice().sort(byTs);
    }
    // Застосунок YouTube поза кліком по посиланню (кнопки «Дивитися», «підряд», «Мій день»)
    function openInApp(p) {
        if (IS_ANDROID) openApp('intent://www.youtube.com/watch?v=' + encodeURIComponent(p.y) +
            '#Intent;scheme=https;package=com.google.android.youtube;S.browser_fallback_url=' + encodeURIComponent(ytWatch(p)) + ';end');
        else openApp(ytWatch(p));                       // iOS: перехід на youtube.com — система відкриє застосунок
    }
    window.openVid = function(e, idx, el) {
        if (e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;   // Ctrl/Cmd-клік — браузер відкриє YouTube у новій вкладці
        let p = PLAY[idx] || {};
        QUEUE_ON = false;
        if (isAppVideo(p)) {
            // iOS: звичайний перехід за посиланням youtube.com — система сама відкриє застосунок (Universal Link).
            // Android: intent — застосунок YouTube, а якщо його нема — сторінка відео в браузері.
            markWatched(p.key);
            if (IS_ANDROID) { e.preventDefault(); openInApp(p); }
            return;
        }
        e.preventDefault();
        lastFocus = el || document.activeElement;
        showRec(p, p.ctx || 'cal');
    };
    window.daySheet = function(idx, btn) {
        let p = PLAY[idx];
        if (!p) return;
        QUEUE_ON = false; lastFocus = btn || document.activeElement;
        showRec(p, p.ctx || 'cal');
    };
    window.playSheet = function(e) {                    // «▶ Дивитися в YouTube» з аркуша дня
        if (!CUR) return;
        markWatched(CUR.p.key);
        if (IS_ANDROID) { e.preventDefault(); openInApp(CUR.p); }
    };

    const WD_FULL = ['неділя', 'понеділок', 'вівторок', 'середа', 'четвер', 'пʼятниця', 'субота'];
    function fmtDayLong(d) { return fmtDay(d, true) + ' · ' + WD_FULL[new Date(dayNum(d) * DAY_MS).getUTCDay()]; }
    function navHtml(list, i, ctx) {
        if (i < 0 || list.length < 2) return '';
        let prev = list[i - 1], next = list[i + 1], y = todayStr().slice(0, 4);
        let lbl = r => fmtDay(r.date, r.date.slice(0, 4) !== y);
        let mid = ctx === 'queue' ? `З твого візиту · ${i + 1} з ${list.length}`
            : ctx === 'topic' || (ctx === 'films' && TOPIC) ? `${esc(topicLabel(TOPIC))} · ${i + 1} / ${list.length}`
            : ctx === 'films' ? `№ ${filmNo(list[i].key)} із ${(EPS.films || []).length}` : `${i + 1} / ${list.length}`;   // «із»: велике «З» схоже на 3
        return `<button type="button" class="mnav" onclick="navStep(-1)"${prev ? ` aria-label="Попередній: ${esc(lbl(prev))}"` : ' disabled'}>‹ ${prev ? esc(lbl(prev)) : ''}</button>` +
            `<span class="mnav-pos">${mid}</span>` +

    // ── 🖼 Картка дня: вертикальна картинка 1080×1920 для Stories (Instagram, Telegram) ─────────────

    const CARD_W = 1080, CARD_H = 1920;

    function loadImg(src, cors) {

    async function cardImage(p) {

    function rrect(g, x, y, w, h, r) {

    function drawMoon(g, cx, cy, r) {                    // 🌓 з логотипа: ліва половина темна, права світла + червона крапка

    async function makeCard(p) {

            // полями Stories (записки здебільшого нема — картка не має бути «порожньою внизу»)
            const TOP = 230, BOTTOM = 1550, dated = DATE_RE.test(p.date || '');
            let title = showTitle(p.title || ''), body = ((metaById[p.key] || {}).body || '').replace(/(\s*#[\p{L}\p{N}_]+)+\s*$/u, '').trim();

                g.fillStyle = 'rgba(255,255,255,.6)'; g.font = `700 32px ${SANS}`;
                if ('letterSpacing' in g) g.letterSpacing = '4px';
                g.fillText(`${WD_FULL[new Date(dayNum(p.date) * DAY_MS).getUTCDay()]} · ${yy}`.toUpperCase(), 60, y + 62);
                if ('letterSpacing' in g) g.letterSpacing = '0px';
                y += 100;
            } else y += 40;
            g.fillStyle = '#fff'; g.font = `700 54px ${SANS}`;
            tLines.forEach(l => { y += 66; g.fillText(l, 60, y); });
            if (tLines.length) y += 26;
            g.fillStyle = 'rgba(255,255,255,.86)'; g.font = `italic 400 40px ${SERIF}`;
            bLines.forEach(l => { y += 58; g.fillText(l, 60, y); });
            drawMoon(g, 84, 1632, 24);
            g.fillStyle = '#fff'; g.font = `700 30px ${SANS}`;
            if ('letterSpacing' in g) g.letterSpacing = '6px';
            g.fillText('ЛОВИ ДЕНЬ', 128, 1643);
            if ('letterSpacing' in g) g.letterSpacing = '0px';
            g.fillStyle = 'rgba(255,255,255,.6)'; g.font = `400 30px ${SANS}`;
            g.fillText(location.host + (dated ? '/d/' + p.date : ''), 60, 1702);
        };
        let toBlob = () => new Promise(res => { try { c.toBlob(b => res(b), 'image/jpeg', .9); } catch(e) { res(null); } });
        draw(await cardImage(p));
        let blob = await toBlob();
        if (!blob) { draw(null); blob = await toBlob(); }    // «чуже» зображення зіпсувало полотно — картка без кадру
        return blob;
    }
    let CARD = null;                                     // {key, promise} — картка, зібрана заздалегідь
    function prepCard(p) { if (!CARD || CARD.key !== p.key) CARD = { key: p.key, promise: makeCard(p) }; return CARD.promise; }
    window.shareCard = async function(btn) {
        if (!CUR) return;
        let p = CUR.p, blob = await prepCard(p);
        if (!blob) return;
        let name = 'den-' + (DATE_RE.test(p.date || '') ? p.date : 'video') + '.jpg';
        let file = new File([blob], name, { type: 'image/jpeg' });
        if (OPEN_IN_APP && navigator.canShare && navigator.canShare({ files: [file] })) {
            try { await navigator.share({ files: [file] }); return; }
            catch(e) { if (e && e.name === 'AbortError') return; }      // інакше — показати картинку
            showCardPreview(blob);
            return;
        }
        if (OPEN_IN_APP) { showCardPreview(blob); return; }
        let a = document.createElement('a'), url = URL.createObjectURL(blob);
        a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 30000);
        if (btn) { let t = btn.textContent; btn.textContent = '✓ Збережено'; setTimeout(() => { btn.textContent = t; }, 2000); }
    };
    function showCardPreview(blob) {
        let old = $('cardPrev'); if (old) old.remove();
        let d = document.createElement('div'); d.id = 'cardPrev'; d.className = 'card-prev';
        d.innerHTML = `<img alt="Картка дня" src="${URL.createObjectURL(blob)}">Утримай картинку, щоб зберегти, і додай в історію.`;
        $('modNote').appendChild(d);
        d.scrollIntoView({ block: 'nearest' });
    }

    // Показати день на стіні: розгорнути «Раніше», прокрутити, коротко підсвітити; open — ще й відкрити відео
    // (той самий клік по плитці: компʼютер — вікно, телефон — застосунок YouTube)
    // Фільмотека: перша афіша того дня
    function dayEl(date) { return (FILMS && document.querySelector(`#films .film[data-date="${date}"]`)) || document.getElementById('cal-' + date); }
    window.showDay = function(date, key, open) {
        if (!DATE_RE.test(date || '')) return false;
        let cell = dayEl(date);
        if (!cell) return false;
        let det = cell.closest('details'); if (det) det.open = true;
        cell.scrollIntoView({ behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block: 'center' });
        cell.classList.remove('flash'); void cell.offsetWidth; cell.classList.add('flash');
        if (open) {
            let a = [...cell.querySelectorAll('a.v-lnk, a.poster')].find(x => !key || x.dataset.k === key);
            if (a) a.click();
        }
        return true;
    };
    // 🎲 Випадковий день — з усієї стіни, а якщо вибрано тему, то з її відео; двічі поспіль той самий не випадає
    let lastRandom = '';
    window.randomDay = function() {
        let pool = (EPS.cal || []).filter(r => r.y || r.v);
        if (TOPIC) { let inTopic = pool.filter(r => recTopics(r).includes(TOPIC)); if (inTopic.length) pool = inTopic; }
        if (pool.length > 1) pool = pool.filter(r => r.key !== lastRandom);
        if (!pool.length) return;
        let rec = pool[Math.floor(Math.random() * pool.length)];
        lastRandom = rec.key;
        showDay(rec.date, rec.key, true);
    };
    // 🔗 Посилання на день: /d/РРРР-ММ-ДД/ — гарне прев'ю в Telegram (сторінку генерує архів на GitHub);
    // на телефоні — системне меню «Поділитися», на компʼютері — копія в буфер обміну
    window.shareDay = async function(date, btn) {
        let url = location.origin + '/d/' + date + '/';
        try {
            if (navigator.share && OPEN_IN_APP) { await navigator.share({ url }); return; }
            await navigator.clipboard.writeText(url);
            if (btn) { let t = btn.textContent; btn.textContent = '✓ Скопійовано'; setTimeout(() => { btn.textContent = t; }, 2000); }
        } catch(e) {
            if (e && e.name === 'AbortError') return;          // людина сама закрила меню «Поділитися»
            window.prompt('Посилання на цей день:', url);
        }
    };

    // 📱 Застосунок на головному екрані (PWA): офлайн-копія сторінки; на iPhone застосунок із головного екрана
    // не потрапляє під 7-денне стирання сховища Safari — відмітки «переглянуто» не губляться.
    if ('serviceWorker' in navigator && window.isSecureContext)
        addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
    // Кнопка «Встановити» — там, де браузер це вміє (Chrome, Edge, Android). На iPhone: «Поділитися → На початковий екран».
    let installEvt = null;
    addEventListener('beforeinstallprompt', e => { e.preventDefault(); installEvt = e; document.getElementById('install').hidden = false; });
    addEventListener('appinstalled', () => { installEvt = null; document.getElementById('install').hidden = true; });
    window.installApp = async function() {
        if (!installEvt) return;
        installEvt.prompt();
        try { await installEvt.userChoice; } catch(e) {}
        installEvt = null; document.getElementById('install').hidden = true;
    };

    document.addEventListener('keydown', e => {
        if (e.key === 'Escape') { closeModal(); return; }
        if (!CUR || !/^Arrow(Left|Right)$/.test(e.key) || e.altKey || e.ctrlKey || e.metaKey) return;
        if (/^(INPUT|SELECT|TEXTAREA)$/.test((e.target || {}).tagName || '')) return;
        e.preventDefault(); navStep(e.key === 'ArrowRight' ? 1 : -1);    // гортати дні, як сторінки
    });
    // Вибір теми живе в адресі (#t=…): «назад» у браузері повертає попередній вибір, посиланням можна поділитися
    window.addEventListener('hashchange', () => {
        let d = dayFromHash();
        if (d && d !== DAY_DONE) { DAY_DONE = d; closeModal(); showDay(d, '', !OPEN_IN_APP); return; }
        if (location.hash.startsWith('#f-')) render();  // посилання на збір — підсвітити його в шапці
        let t = topicFromHash();
        if (t === TOPIC) return;
        TOPIC = t; closeModal(); render();
        if (t) { let el = document.getElementById('topic'); if (el) el.scrollIntoView({ block: 'start' }); }
    });

    // Свайп униз — закрити; вліво/вправо — наступний/попередній день
    let tY = 0, tX = 0, mod = document.getElementById('vidModal'), mIn = document.getElementById('modIn');
    mod.addEventListener('touchstart', e => { tY = e.touches[0].clientY; tX = e.touches[0].clientX; }, {passive:true});
    mod.addEventListener('touchmove', e => { let dY = e.touches[0].clientY - tY, dX = e.touches[0].clientX - tX;
        if (dY > 0 && Math.abs(dY) > Math.abs(dX) && mIn.scrollTop <= 0) mIn.style.transform = `translateY(${dY}px)`; }, {passive:true});
    mod.addEventListener('touchend', e => {
        let dY = e.changedTouches[0].clientY - tY, dX = e.changedTouches[0].clientX - tX;
        mIn.style.transform = '';
        if (dY > 100 && Math.abs(dY) > Math.abs(dX)) closeModal();
        else if (Math.abs(dX) > 60 && Math.abs(dX) > Math.abs(dY) * 1.5) navStep(dX < 0 ? 1 : -1);
    }, {passive:true});

    init();
</script>
</body>
</html>
