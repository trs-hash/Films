<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тарас Максимʼяк</title>
    <meta name="description" content="Щоденні стрічки Тараса Максимʼяка. Одне відео про кожен день, який більше не повториться.">

    <meta property="og:title" content="Taras Maksymiak">
    <meta property="og:description" content="Щодня — одна стрічка про день, який більше не повториться.">
    <meta property="og:image" content="https://taras.kyiv.ua/image.png">
    <meta property="og:url" content="https://taras.kyiv.ua/">
    <meta name="twitter:card" content="summary_large_image">

    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌓</text></svg>">
    <link rel="preconnect" href="https://i.ytimg.com" crossorigin>
    <link rel="preconnect" href="https://www.googleapis.com" crossorigin>
    <style>
        :root{--bg:#fff;--txt:#222;--cell:#f8f8f8;--mut:#888;--div:#eaeaea;--red:#e62117}
        @media (prefers-color-scheme:dark){:root{--bg:#121212;--txt:#e0e0e0;--cell:#1e1e1e;--mut:#aaa;--div:#333}}
        body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:var(--bg);color:var(--txt);margin:0;padding:20px 20px 0;overflow-x:hidden;scroll-behavior:smooth}
        .wrap{max-width:1400px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
        .main{flex:1}
        .intro{margin:10px 0 50px}
        .intro .name{font-size:14px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--mut);margin-bottom:18px}
        .intro .motto{font-size:42px;font-weight:800;line-height:1.05;letter-spacing:-1px;margin:0 0 18px}
        .intro .lede{font-size:16px;line-height:1.5;color:var(--mut);max-width:560px;margin:0 0 28px;font-weight:400}
        .intro .links{display:flex;flex-wrap:wrap;gap:10px}
        .intro .links a{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:700;letter-spacing:1px;text-transform:uppercase;text-decoration:none;padding:10px 16px;border-radius:8px;transition:.2s}
        .intro .links a.primary{background:var(--txt);color:var(--bg)}
        .intro .links a.primary:hover{background:var(--red)}
        .intro .links a.ghost{color:var(--mut);border:1px solid var(--div)}
        .intro .links a.ghost:hover{color:var(--red);border-color:var(--red)}
        h2{font-size:48px;font-weight:800;margin:60px 0 10px;line-height:1;letter-spacing:-1px}
        h2:first-child{margin-top:10px}
        .info{margin-bottom:25px}
        .info a{display:inline-flex;align-items:center;gap:5px;font-size:13px;color:var(--mut);font-weight:600;letter-spacing:2px;text-decoration:none;transition:.2s}
        .info a:hover{color:var(--red)}
        .nav-base{background:var(--cell);border-radius:8px;display:flex;border:1px solid var(--div);margin-bottom:40px;overflow:hidden}
        .nav-seg{flex:1;text-align:center;font-size:11px;font-weight:700;color:var(--mut);cursor:pointer;text-transform:uppercase;letter-spacing:1px;padding:12px 5px;transition:.2s;user-select:none;-webkit-tap-highlight-color:transparent}
        .nav-seg:hover{color:var(--red)}
        .mo-wrap{margin-bottom:40px;scroll-margin-top:20px}
        .mo-hdr{color:var(--mut);font-size:22px;font-weight:500;text-transform:uppercase;margin:0 0 20px;letter-spacing:1px}
        .grid{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
        .cell{aspect-ratio:16/9;position:relative;background:var(--cell);border-radius:6px;overflow:hidden;transform:translateZ(0)}
        .cell.empty{background:transparent}
        .week-divider{grid-column:1/-1;height:2px;background:var(--div);border-radius:2px;margin:8px 0}
        .dt{position:absolute;top:8px;left:10px;display:flex;align-items:baseline;gap:6px;z-index:10;pointer-events:none}
        .dt-n{font-size:18px;font-weight:800;line-height:1;color:var(--date-color,#ccc)}
        .dt-d{font-size:10px;font-weight:500;text-transform:uppercase;color:var(--date-color,#ccc);opacity:.6}
        .has-vid .dt-n,.has-vid .dt-d{color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.9)}
        .has-vid .dt-d{opacity:.7;text-shadow:0 1px 2px rgba(0,0,0,.9)}
        .v-cont{position:absolute;inset:0;display:flex;z-index:5}
        .v-lnk{position:relative;flex:1;height:100%;display:block;cursor:pointer;overflow:hidden;text-decoration:none}
        .v-cont.mult .v-lnk:not(:last-child){border-right:2px solid #fff}
        .v-thumb{width:100%;height:100%;object-fit:cover;transition:transform .4s;background:#e0e0e0}
        @media (prefers-color-scheme:dark){.v-thumb{background:#2a2a2a}}
        .v-lnk:hover .v-thumb{transform:scale(1.03)}
        .v-lnk::after{content:'';position:absolute;inset:0;background:linear-gradient(to bottom,rgba(0,0,0,.4) 0%,transparent 40%,rgba(0,0,0,.9) 100%);pointer-events:none}
        .v-title{position:absolute;bottom:10px;left:10px;right:10px;color:#fff;font-size:11px;font-weight:500;text-shadow:0 1px 2px #000;z-index:10;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
        /* Уривок нотатки на плитці — лише на desktop (наведення); стіна в спокої чиста */
        .v-excerpt{position:absolute;left:10px;right:10px;bottom:30px;color:#fff;font-family:Georgia,'Times New Roman',serif;font-size:10.5px;line-height:1.4;z-index:9;opacity:0;transform:translateY(6px);transition:opacity .25s,transform .25s;pointer-events:none;text-shadow:0 1px 3px rgba(0,0,0,.95);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
        @media (hover:hover) and (pointer:fine){
            .v-lnk:hover .v-excerpt{opacity:1;transform:translateY(0)}
            .v-lnk:hover::after{background:linear-gradient(to bottom,rgba(0,0,0,.35) 0%,transparent 28%,rgba(0,0,0,.92) 82%)}
        }
        .v-lnk.watched .v-thumb{filter:grayscale(1) opacity(0.8)}
        .v-lnk.watched::before,.v-lnk.watched::after{content:'';position:absolute;top:50%;left:50%;width:150%;height:3px;background:var(--red);z-index:20;pointer-events:none;box-shadow:0 0 5px rgba(0,0,0,.3)}
        .v-lnk.watched::before{transform:translate(-50%,-50%) rotate(45deg)}
        .v-lnk.watched::after{transform:translate(-50%,-50%) rotate(-45deg)}
        .count{margin:30px 0 70px}
        .count .cd-lbl{font-size:13px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--mut);margin-bottom:12px}
        .count .cd-num{font-size:120px;font-weight:800;letter-spacing:-4px;line-height:1}
        .count .cd-sub{font-size:15px;color:var(--mut);margin-top:12px}
        .modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:1000;align-items:center;justify-content:center}
        .modal.show{display:flex}
        .mod-in{width:100%;max-width:1000px;padding:20px;position:relative;transition:transform .2s ease-out;max-height:94vh;overflow-y:auto;-webkit-overflow-scrolling:touch}
        .iframe-wrap{position:relative;padding-bottom:56.25%;height:0;overflow:hidden;border-radius:8px;background:#000}
        .iframe-wrap iframe,.iframe-wrap video{position:absolute;top:0;left:0;width:100%;height:100%;border:0;background:#000}
        .iframe-wrap video{display:none}
        .close{position:absolute;top:-15px;right:20px;color:#fff;font-size:40px;cursor:pointer;line-height:1;z-index:10}
        .close:hover{color:var(--red)}
        .footer{text-align:center;padding:60px 0;font-size:11px;color:var(--mut);letter-spacing:2px}
        .contact{text-align:center;padding:40px 0 0}
        .contact a{font-size:12px;letter-spacing:1px;color:#dcdcdc;text-decoration:none;transition:.25s}
        .contact a:hover{color:var(--mut)}
        @media(prefers-color-scheme:dark){.contact a{color:#2c2c2c}}
        @media(max-width:1024px){.grid{grid-template-columns:repeat(4,1fr)}}
        @media(max-width:600px){
            body{padding:15px 15px 0}
            .grid{grid-template-columns:repeat(2,1fr)}
            h2{font-size:38px}
            .intro{margin:5px 0 35px}
            .intro .motto{font-size:32px}
            .intro .lede{font-size:15px}
            .dt-n{font-size:16px}
            .dt-d{font-size:9px}
            .count .cd-num{font-size:80px;letter-spacing:-3px}
            .mod-in{padding:10px}
            .close{right:10px;top:-25px}
            .nav-seg{font-size:9px;letter-spacing:0;padding:10px 2px}
            .footer{padding:50px 0}
        }
        /* ── Записка дня (щоденник) + маркер важливого (Трек C) ── */
        .cell .star{position:absolute;top:2px;right:3px;width:26px;height:26px;z-index:16;pointer-events:none;filter:drop-shadow(0 1px 2px rgba(0,0,0,.6));transform:rotate(-8deg)}
        .note{margin-top:14px}
        .note-card{position:relative;background:var(--note-bg,#faf9f4);border:1px solid var(--div);border-left:3px solid var(--red);border-radius:10px;padding:20px 22px 22px}
        .note-foot{margin-top:18px;font-size:11px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--mut);font-variant-numeric:tabular-nums}
        .note-body{font-family:Georgia,'Iowan Old Style','Times New Roman',serif;font-size:16.5px;line-height:1.75;color:var(--txt);white-space:pre-wrap;word-wrap:break-word;overflow-wrap:anywhere;max-width:66ch}
        .note-card .star{position:absolute;top:16px;right:16px;width:30px;height:30px;transform:rotate(-8deg)}
        .note-card.imp{padding-right:52px}
        @media (prefers-color-scheme:dark){.note-card{--note-bg:#191919}}
    </style>
</head>

<script>
    // TODO: заміни на НОВИЙ ключ з окремого проєкту "taras-site" (крок 2 інструкції).
    // Старий ключ після заміни регенеруй у консолі — опублікована копія помре.
    const API_KEY = 'AIzaSyBk_r3wrlYczHybeZtnPBID4zK_yv_XuHw';
    // Uploads-плейлист каналу UCRSKTGA5a2hLrai_MXNaoUQ (@Taras.maksymiak).
    const UPLOADS_ID = 'UURSKTGA5a2hLrai_MXNaoUQ';

    // ── Два режими (Ф3 «судний день») ──────────────────────────────────────────
    // youtube  — жива стрічка з YouTube API (як було); doomsday — незалежна від YouTube:
    // читаємо локальний archive.json (постери + проксі + опис-щоденник). Режим задає
    // state.json {"mode":...}; АВТО-ФОЛБЕК: якщо YouTube мовчить — самі переходимо в doomsday.
    let MODE = 'youtube';
    let BASE = '';               // префікс локальних відео (Фаза 5); '' → грає YouTube-плеєр за id
    let videosMap = {};          // {date: [rec]}, rec = {key,title,thumb,imp,y,v}
    let metaById = {};           // {key: {title,time,body,important}}
    let PLAY = [];               // реєстр програвання: PLAY[idx] = {key,y,v} (без крихких inline-id)
    let watched = JSON.parse(localStorage.getItem('vw') || '[]');

    function esc(s) {
        return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }

    // Записка дня (Трек C): опис відео = щоденник. Штамп часу з Треку B — підпис у кінці.
    // Маркер важливого дня — символ № (Shift+3, укр. розкладка), який НЕ є нумерацією («№5»).
    const IMPORTANT_RE = /№(?!\d)/;                                 // важливий день (самостійний №)
    const TS_RE = /🕒\s*(\d{2}:\d{2}\s+\d{2}\/\d{2}\/\d{4})/;        // штамп часу з опису (Трек B, у кінці)
    // Червона зірочка-асстериск «наче від руки» — три хвилясті штрихи через центр.
    const STAR_SVG = '<svg class="star" viewBox="0 0 40 40" aria-hidden="true">' +
        '<g stroke="#e62117" stroke-width="3.4" stroke-linecap="round" fill="none">' +
        '<path d="M20 5 Q18.6 20 20.2 35"/>' +
        '<path d="M7 12.5 Q20 20 33.4 26.5"/>' +
        '<path d="M33 12 Q19.6 21 7.2 27.2"/></g></svg>';

    function parseDesc(raw) {
        let desc = (raw || '').replace(/\r/g, '');
        let important = IMPORTANT_RE.test(desc);
        let clean = desc.replace(/№(?!\d)/g, '');                     // прибрати маркер важливого
        let time = '';
        let m = clean.match(TS_RE);
        if (m) { time = m[1]; clean = clean.replace(m[0], ''); }       // прибрати штамп із тексту щоденника
        let body = clean.replace(/[ \t]{2,}/g, ' ').replace(/\n{3,}/g, '\n\n').trim();
        return { important, time, body };
    }

    function daysWord(n) {
        let m10 = n % 10, m100 = n % 100;
        if (m10 === 1 && m100 !== 11) return 'день';
        if (m10 >= 2 && m10 <= 4 && (m100 < 10 || m100 >= 20)) return 'дні';
        return 'днів';
    }

    // ── Джерела даних ──────────────────────────────────────────────────────────
    async function loadMode() {
        try {
            let r = await fetch('state.json?cb=' + Date.now(), { cache: 'no-store' });
            if (!r.ok) return 'youtube';
            let d = await r.json();
            return (d && d.mode === 'doomsday') ? 'doomsday' : 'youtube';
        } catch(e) { return 'youtube'; }
    }

    async function fetchAPI(token = '', acc) {
        acc = acc || { map: {}, meta: {} };
        try {
            let res = await fetch(`https://www.googleapis.com/youtube/v3/playlistItems?part=snippet&playlistId=${UPLOADS_ID}&maxResults=50&key=${API_KEY}${token ? '&pageToken='+token : ''}`);
            if (!res.ok) throw new Error('HTTP ' + res.status);
            let data = await res.json();
            if (data.error) throw new Error(data.error.message || 'API error');
            (data.items || []).forEach(i => {
                let s = i.snippet;
                if (!s || !s.publishedAt) return;
                let date = s.publishedAt.split('T')[0];
                let t = s.thumbnails || {};
                let vid = s.resourceId.videoId;
                let pd = parseDesc(s.description);
                if (!acc.map[date]) acc.map[date] = [];
                acc.map[date].push({ key: vid, title: s.title, y: vid, v: '',
                    thumb: (t.high || t.standard || t.default || {}).url || '', imp: pd.important });
                acc.meta[vid] = { title: s.title, time: pd.time, body: pd.body, important: pd.important };
            });
            if (data.nextPageToken) return await fetchAPI(data.nextPageToken, acc);
            videosMap = acc.map; metaById = acc.meta;      // коміт лише за повного успіху (без дублів кешу)
            return true;
        } catch(e) {
            console.error('YouTube API error:', e.message);
            return false;
        }
    }

    // Судний день: читаємо локальний archive.json (незалежно від YouTube).
    // Форма (site_publisher): {base, days:{date:[{t,p,v,y,d,desc}]}}.
    async function loadArchive() {
        try {
            let res = await fetch('archive.json?cb=' + Date.now(), { cache: 'no-store' });
            if (!res.ok) throw new Error('HTTP ' + res.status);
            let data = await res.json();
            BASE = data.base || '';
            let map = {}, meta = {}, days = data.days || {};
            Object.keys(days).forEach(date => {
                (days[date] || []).forEach((it, n) => {
                    let key = it.y || it.v || (date + '_' + n);
                    let pd = parseDesc(it.desc || '');
                    if (!map[date]) map[date] = [];
                    map[date].push({ key: key, title: it.t || '', y: it.y || '', v: it.v || '',
                        thumb: it.p || '', imp: pd.important });
                    meta[key] = { title: it.t || '', time: pd.time, body: pd.body, important: pd.important };
                });
            });
            videosMap = map; metaById = meta;
            return true;
        } catch(e) {
            console.error('archive.json error:', e.message);
            return false;
        }
    }

    async function init() {
        MODE = await loadMode();
        if (MODE === 'doomsday') {                     // явний судний день зі state.json
            if (await loadArchive()) { render(); return; }
            MODE = 'youtube';                          // архів недоступний — пробуємо YouTube
        }
        // youtube-режим: спершу кеш (миттєво), потім жива відповідь
        let cached = localStorage.getItem('yt_data2'), cmeta = localStorage.getItem('yt_meta2'),
            time = localStorage.getItem('yt_time2'), now = Date.now(), hadCache = false;
        if (cached && time && (now - time) < 21600000) {
            try { videosMap = JSON.parse(cached); if (cmeta) metaById = JSON.parse(cmeta); hadCache = true; render(); } catch(e) {}
        }
        if (await fetchAPI()) {
            localStorage.setItem('yt_data2', JSON.stringify(videosMap));
            localStorage.setItem('yt_meta2', JSON.stringify(metaById));
            localStorage.setItem('yt_time2', now);
            render();
        } else if (await loadArchive()) {              // ⚑ YouTube мовчить → авто-судний-день
            MODE = 'doomsday';
            render();
        } else if (!hadCache) {
            document.getElementById('app').innerHTML =
                '<div style="text-align:center;padding:60px 20px;color:var(--mut);font-family:-apple-system,sans-serif">' +
                'Не вдалось завантажити відео. Спробуйте оновити сторінку.</div>';
        }
    }

    // Найраніша дата з даними — календар стартує звідси (без хардкоду/зворотного відліку).
    function firstDate() {
        let ks = Object.keys(videosMap).filter(k => /^\d{4}-\d{2}-\d{2}$/.test(k) && videosMap[k] && videosMap[k].length).sort();
        return ks.length ? ks[0] : null;
    }

    function render() {
        PLAY = [];
        let today = new Date();
        let fd = firstDate();
        // Ще нема жодного дня → спокійна заглушка (без відліку/дедлайну — рішення Тараса).
        if (!fd) {
            document.getElementById('app').innerHTML =
                `<div class="count"><div class="cd-lbl">Стіна днів</div>` +
                `<div class="cd-sub" style="margin-top:22px;font-size:17px">Скоро тут зʼявиться перша стрічка.</div></div>`;
            return;
        }
        let [sy, sm, sd] = fd.split('-').map(Number);
        let startY = sy, startM = sm - 1, startD = sd;

        let html = '';
        let loop = new Date(startY, startM, 1);
        let curY = 0;
        let wDays = ["НД", "ПН", "ВТ", "СР", "ЧТ", "ПТ", "СБ"];
        let mNames = ["Січень", "Лютий", "Березень", "Квітень", "Травень", "Червень", "Липень", "Серпень", "Вересень", "Жовтень", "Листопад", "Грудень"];
        let abbr = ['СІЧ', 'ЛЮТ', 'БЕР', 'КВІ', 'ТРА', 'ЧЕР', 'ЛИП', 'СЕР', 'ВЕР', 'ЖОВ', 'ЛИС', 'ГРУ'];

        while (loop <= today) {
            let y = loop.getFullYear(), m = loop.getMonth();
            if (y !== curY) {
                html += `<h2>${y}</h2>`;
                if (curY === 0) {
                    let navHtml = '';
                    for(let i = 0; i <= 11; i++) {
                        if (y === startY && i < startM) continue;
                        if (y === today.getFullYear() && i > today.getMonth()) continue;
                        navHtml += `<div class="nav-seg" onclick="document.getElementById('m-${y}-${i}').scrollIntoView({behavior:'smooth', block:'start'})">${abbr[i]}</div>`;
                    }
                    if (navHtml) html += `<div class="nav-base">${navHtml}</div>`;
                }
                curY = y;
            }

            html += `<div class="mo-wrap" id="m-${y}-${m}"><div class="mo-hdr">${mNames[m]}</div><div class="grid">`;

            let dMax = new Date(y, m + 1, 0).getDate();
            let dStartRender = (y === startY && m === startM) ? startD : 1;
            // Стіна тримає лише прожиті дні: майбутні клітинки не малюємо.
            let dEnd = (y === today.getFullYear() && m === today.getMonth()) ? today.getDate() : dMax;

            for (let d = dStartRender; d <= dEnd; d++) {
                let dw = new Date(y, m, d).getDay();

                if (dw === 1 && d !== dStartRender) {
                    html += `<div class="week-divider"></div>`;
                }

                let key = `${y}-${(m+1).toString().padStart(2,'0')}-${d.toString().padStart(2,'0')}`;
                let v = videosMap[key];

                let cCls = (v && v.length) ? 'cell has-vid' : 'cell empty';
                let cIn = '';

                if (v && v.length) {
                    v.forEach(rec => {
                        let idx = PLAY.push({ key: rec.key, y: rec.y || '', v: rec.v || '' }) - 1;
                        let wCls = watched.includes(rec.key) ? ' watched' : '';
                        let mb = (metaById[rec.key] || {}).body || '';
                        let exc = mb ? `<div class="v-excerpt">${esc(mb.slice(0, 160))}</div>` : '';
                        cIn += `<a href="#" class="v-lnk${wCls}" onclick="openVid(event, ${idx}, this)"><img src="${esc(rec.thumb || '')}" class="v-thumb" loading="lazy" decoding="async" alt="">${exc}<div class="v-title">${esc(rec.title || '')}</div></a>`;
                    });
                }
                let starHtml = (v && v.some(x => x.imp)) ? STAR_SVG : '';
                html += `<div class="${cCls}"><div class="v-cont ${v && v.length>1?'mult':''}">${cIn}</div><div class="dt"><span class="dt-n">${d}</span><span class="dt-d">${wDays[dw]}</span></div>${starHtml}</div>`;
            }
            html += `</div></div>`;
            loop.setMonth(m + 1);
        }
        document.getElementById('app').innerHTML = html;
    }

    window.openVid = function(e, idx, el) {
        e.preventDefault();
        let p = PLAY[idx] || {};
        if (p.key && !watched.includes(p.key)) {
            watched.push(p.key);
            localStorage.setItem('vw', JSON.stringify(watched));
        }
        if (el) el.classList.add('watched');
        // Записка дня під плеєром (щоденник): текст веде, штамп часу — підпис знизу; зірка, якщо важливо.
        let meta = metaById[p.key] || {};
        let note = document.getElementById('modNote');
        note.innerHTML = (meta.time || meta.body)
            ? `<div class="note-card${meta.important ? ' imp' : ''}">` +
              (meta.important ? STAR_SVG : '') +
              (meta.body ? `<div class="note-body">${esc(meta.body)}</div>` : '') +
              (meta.time ? `<div class="note-foot">🕒 ${esc(meta.time)}</div>` : '') + `</div>`
            : '';
        // Плеєр: локальне відео (судний день, Фаза 5) якщо є base+v, інакше YouTube-ембед за id.
        let iframe = document.getElementById('ytIframe'), loc = document.getElementById('locVideo');
        let local = (BASE && p.v) ? (BASE.replace(/\/+$/, '') + '/' + p.v.replace(/^\/+/, '')) : '';
        if (local) {
            iframe.src = ''; iframe.style.display = 'none';
            loc.src = local; loc.style.display = 'block'; try { loc.play(); } catch(_) {}
        } else if (p.y) {
            try { loc.pause(); } catch(_) {} loc.removeAttribute('src'); loc.style.display = 'none';
            iframe.style.display = 'block'; iframe.src = 'https://www.youtube.com/embed/' + p.y + '?autoplay=1';
        } else {                                        // нема чим грати — постер+записка (Фаза 5 дасть відео)
            iframe.src = ''; iframe.style.display = 'none';
            try { loc.pause(); } catch(_) {} loc.removeAttribute('src'); loc.style.display = 'none';
        }
        document.getElementById('vidModal').classList.add('show');
        document.getElementById('modIn').scrollTop = 0;
        document.body.style.overflow = 'hidden';
    }

    window.closeModal = function() {
        let iframe = document.getElementById('ytIframe'), loc = document.getElementById('locVideo');
        iframe.src = '';
        try { loc.pause(); } catch(_) {} loc.removeAttribute('src');
        document.getElementById('vidModal').classList.remove('show');
        document.body.style.overflow = 'auto';
        document.getElementById('modIn').style.transform = '';
    }

    document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

    let tY = 0, mod = document.getElementById('vidModal'), mIn = document.getElementById('modIn');
    mod.addEventListener('touchstart', e => tY = e.touches[0].clientY, {passive:true});
    mod.addEventListener('touchmove', e => { let dY = e.touches[0].clientY - tY; if(dY>0 && mIn.scrollTop<=0) mIn.style.transform = `translateY(${dY}px)`; }, {passive:true});
    mod.addEventListener('touchend', e => { if(e.changedTouches[0].clientY - tY > 100) closeModal(); else mIn.style.transform = ''; }, {passive:true});

    setTimeout(init, 0);
</script>
</body>
</html>
